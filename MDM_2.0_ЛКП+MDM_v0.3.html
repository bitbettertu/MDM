function shell(content){const reqBadge=requests.filter(r=>/провер|Ожидает|Готов/.test(r.status)).length;return '<div class="app '+(state.menu?'menu-open':'')+'"><aside class="sidebar"><div class="brand"><div class="brand-logo">U</div><div class="brand-copy"><strong>MDM 2.0</strong><span>UMAI GROUP · внутр.</span></div></div><div class="side-scroll">'+navGroups.map(g=>'<div class="nav-label">'+g[0]+'</div>'+g[1].map(n=>'<button class="nav-btn '+(state.screen===n[0]?'active':'')+'" data-action="nav" data-screen="'+n[0]+'">'+icon(n[1])+'<span>'+n[2]+'</span>'+(n[0]==='requests'?'<em class="badge">'+reqBadge+'</em>':n[0]==='tasks'?'<em class="badge">'+tasks.filter(t=>!t.status.includes('Заверш')).length+'</em>':'')+'</button>').join('')).join('')+'</div><div class="side-footer"><div class="user-card"><div class="avatar">ДС</div><div class="user-meta"><b>Данияр Садыков</b><span>'+state.role+'</span></div><button class="logout" data-action="logout" title="Выход">'+icon('logout')+'</button></div></div></aside><section class="workspace"><header class="topbar"><button class="menu-btn" data-action="menu">'+icon('menu')+'</button><div class="breadcrumb"><strong>'+screenTitle()+'</strong><span>Внутренний контур · '+today+'</span></div><label class="search-global">'+icon('search')+'<input placeholder="Заявка, код, GTIN, товар…" data-global-search value="'+esc(state.search)+'"></label><button class="btn lkp small" data-action="goto-lkp" title="Открыть кабинет поставщика">'+icon('bag')+'Кабинет поставщика</button><select class="role-select" data-role>'+roles.map(r=>'<option '+(state.role===r?'selected':'')+'>'+r+'</option>').join('')+'</select></header><main class="page-scroll"><div class="page">'+content+'<div class="scroll-proof">Конец рабочей области · прототип MDM 2.0 (v0.3)</div></div></main></section>'+(state.modal?modalView():'')+(state.toast?'<div class="toast">'+state.toast+'</div>':'')+'</div>'}

function dashboardView(){const newReq=requests.filter(r=>/провер|Ожидает|Готов/.test(r.status)).length;return '<div class="hero"><div><div class="eyebrow">Сквозной процесс ЛКП → MDM → 1С</div><h1>От заявки поставщика до кода 1С</h1><p>Первичные данные из ЛКП не становятся карточкой автоматически. ОМД принимает заявку, проверяет дубли и маршрут, распределяет задания владельцам блоков. Публикация — только через quality gate.</p></div><div class="hero-note"><b>Фокус v0.3</b><span>Единый источник мастер-данных, дедуп по зеркалу, миграция 15 000 SKU, минимизация обратного потока 1С→MDM.</span><div class="mini-line"><i style="width:82%"></i></div><span style="margin-top:7px">92 атрибута · 9 блоков карточки</span></div></div>'+workflow(1)+'<div class="source-banner cut"><div class="source-badge">1</div><div><b>Единый источник мастер-данных (целевое правило T12/T13)</b><span>Номенклатура и НСИ создаются/меняются только через публикацию из MDM. Прямой ввод в 1С блокируется технически ПОСЛЕ пилота; до cutover действует обязательная ночная сверка по базе «Холдинг».</span></div></div><div class="kpis"><div class="card kpi"><div class="kpi-top"><div class="kpi-icon">'+icon('inbox')+'</div><span class="trend">+4 сегодня</span></div><b>'+newReq+'</b><span>Заявки ждут решения ОМД</span></div><div class="card kpi"><div class="kpi-top"><div class="kpi-icon">'+icon('tasks')+'</div></div><b>'+tasks.filter(t=>!t.status.includes('Заверш')).length+'</b><span>Активные задания отделов</span></div><div class="card kpi"><div class="kpi-top"><div class="kpi-icon">'+icon('users')+'</div></div><b>'+suppliers.filter(s=>s.status==='Одобрен').length+'</b><span>Поставщиков в ЛКП</span></div><div class="card kpi"><div class="kpi-top"><div class="kpi-icon">'+icon('db')+'</div></div><b>~15 000</b><span>SKU в зеркале (миграция)</span></div></div><div class="grid-2"><section class="card panel"><div class="panel-head"><div><h2>Новые входящие заявки</h2><p>Источник — ЛКП (поставщик или менеджер по импорту)</p></div><button class="text-link" data-action="nav" data-screen="requests">Все заявки →</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Заявка / товар</th><th>Канал</th><th>Тип</th><th>Статус</th><th></th></tr></thead><tbody>'+requests.slice(0,4).map(r=>'<tr><td><button class="link-row" data-action="open-request" data-id="'+r.id+'"><span class="row-title">'+r.name+'</span><span class="sub">'+r.number+' · '+r.supplier+'</span></button></td><td><span class="scope-badge '+(r.channel==='Поставщик'?'green':'blue')+'">'+r.channel+'</span></td><td><span class="status '+(r.type.includes('Измен')?'amber':'blue')+'">'+r.type+'</span></td><td><span class="status '+statusClass(r.status)+'">'+r.status+'</span></td><td><button class="btn small" data-action="open-request" data-id="'+r.id+'">Разобрать '+icon('chev')+'</button></td></tr>').join('')+'</tbody></table></div></section><section class="card panel"><div class="panel-head"><div><h2>Владельцы блоков</h2><p>9 блоков карточки · §4.3 ТЗ</p></div></div><div class="metric-list">'+[['КО',KO_FIELDS.length+FLAG_FIELDS.length+CHANNEL_FIELDS.length,'идент., флаги, каналы'],['РЦ',RC_FIELDS.length,'ВГХ, БЕИ, сканер, ГУ'],['Импорт',IMPORT_FIELDS.length,'страна, ТНВЭД, утильсбор'],['УЦП / Контент',UCP_FIELDS.length+CAT_FIELDS.length,'хранение, состав, категория']].map(x=>'<div class="metric-row"><div><b>'+x[0]+'</b><span>'+x[2]+'</span></div><span class="metric-num">'+x[1]+'</span></div>').join('')+'</div><div class="scope-note" style="margin-top:12px">Цены, наценки, остатки, промо остаются операционными в 1С и не проходят через MDM (граница цен, T-раздел §2.4).</div></section></div>'}
function requestsView(){const rows=state.requestFilter==='Все'?requests:requests.filter(r=>r.type===state.requestFilter);return head('Входящие заявки','Здесь начинается внутренний процесс MDM. Показан только входящий поток из ЛКП — интерфейс кабинета поставщика отдельный (кнопка «Кабинет поставщика» в шапке).','<button class="btn">'+icon('download')+'Экспорт xls</button>')+'<div class="source-banner lkp"><div class="source-badge">ЛКП</div><div><b>Входящий интеграционный контур ЛКП → MDM</b><span>Каждая заявка получает номер, supplier_id, фиксированный источник и подтверждение приёма (ack). Передача идемпотентна — повтор не создаёт дубль черновика.</span></div></div><div class="filters"><input class="filter-input" placeholder="Номер, поставщик, товар"><select class="filter-select" data-request-filter><option>Все</option><option>Новый SKU</option><option>Изменение SKU</option></select><span class="filter-spacer"></span><span class="status blue">'+rows.length+' заявок</span></div><div class="card table-wrap"><table class="data-table"><thead><tr><th>Источник / заявка</th><th>Поставщик и товар</th><th>Канал</th><th>Тип</th><th>Ответственный ОМД</th><th>Статус</th><th></th></tr></thead><tbody>'+rows.map(r=>'<tr><td><div class="source-cell"><span class="source-mini lkp">ЛКП</span><div><b>'+r.number+'</b><span class="sub">'+r.received+'</span></div></div></td><td><button class="link-row" data-action="open-request" data-id="'+r.id+'"><span class="row-title">'+r.name+'</span><span class="sub">'+r.supplier+' · GTIN '+r.barcode+'</span></button></td><td><span class="scope-badge '+(r.channel==='Поставщик'?'green':'blue')+'">'+r.channel+'</span></td><td><span class="status '+(r.type.includes('Измен')?'amber':'blue')+'">'+r.type+'</span></td><td>'+r.owner+'</td><td><span class="status '+statusClass(r.status)+'">'+r.status+'</span></td><td><button class="btn small primary" data-action="open-request" data-id="'+r.id+'">Открыть</button></td></tr>').join('')+'</tbody></table></div>'}
function routeCard(r,dept,count,desc){const active=r.route[dept];const opts=employees[dept]||employees.ОМД;return '<div class="route-card '+(active?'':'disabled')+'"><div class="route-head"><input type="checkbox" data-action="toggle-route" data-dept="'+dept+'" '+(active?'checked':'')+'><div><b>'+dept+'</b><span>'+desc+'</span></div><span class="scope-badge '+(active?'green':'')+'">'+count+' полей</span></div><div class="route-body"><label>Исполнитель</label><select '+(active?'':'disabled')+'>'+opts.map(x=>'<option>'+x+'</option>').join('')+'</select><div class="route-meta"><span class="scope-badge">Параллельно</span><span class="scope-badge '+(active?'blue':'')+'">'+(active?'Активный блок':'Не требуется по типу')+'</span></div></div></div>'}
function correctionDiff(r){return '<section class="card panel"><div class="correction-banner"><div class="kpi-icon">'+icon('edit')+'</div><div><b>Заявка на изменение опубликованного SKU</b><span>Действующий Golden Record не меняется напрямую. ОМД сравнивает значения и создаёт задания только владельцам изменённых полей (source-routing).</span></div></div><div class="table-wrap" style="margin-top:13px"><table class="diff-table"><thead><tr><th>Поле</th><th>Действующий GR</th><th>Новое из ЛКП</th><th>Владелец</th><th>Решение</th></tr></thead><tbody>'+r.correction.map(x=>'<tr><td><b>'+esc(x[0])+'</b></td><td class="diff-old">'+esc(x[1])+'</td><td class="diff-new">'+esc(x[2])+'</td><td class="diff-owner">'+x[3]+'</td><td><select><option>Направить в '+x[3]+'</option><option>Принять без задания</option><option>Отклонить изменение</option></select></td></tr>').join('')+'</tbody></table></div></section>'}
function requestView(){const r=reqBy(state.activeRequest)||requests[0];const stage=/Маршрут/.test(r.status)?2:1;const sup=supBy(r.supplierId);return '<div class="request-layout"><div class="request-main"><section class="card request-card"><div class="request-title"><div><div class="request-kicker">'+r.number+' · источник '+r.source+'</div><h1>'+r.name+'</h1><p>'+r.supplier+' · получено '+r.received+' · ответственный '+r.owner+'</p></div><span class="status '+statusClass(r.status)+'">'+r.status+'</span></div><div class="chip-row" style="margin-top:13px"><span class="info-chip lkp">Источник: ЛКП · '+r.channel+'</span><span class="info-chip">'+r.type+'</span><span class="info-chip">GTIN '+r.barcode+'</span>'+(sup?'<span class="info-chip">Контрагент '+sup.code+'</span>':'')+'</div></section><section class="card panel"><div class="panel-head"><div><h2>Сквозной маршрут заявки</h2><p>Карточка и задания создаются только после решения ОМД</p></div></div>'+workflow(stage)+'</section><section class="card panel"><div class="panel-head"><div><h2>Первичные данные из ЛКП</h2><p>Неизменяемый снимок значений, введённых источником. Отделы видят их как базу для заполнения.</p></div><span class="scope-badge red">read-only source</span></div>'+primaryItems(r.primary)+'</section>'+(r.correction?correctionDiff(r):'')+'<section class="card panel"><div class="panel-head"><div><h2>Распределение заданий ОМД</h2><p>Активные блоки определяются по типу номенклатуры (ВИ 3.3.5). Заполнение параллельное.</p></div><div class="assignment-summary"><i></i><b>'+Object.values(r.route).filter(Boolean).length+' активных блока</b></div></div><div class="route-grid">'+routeCard(r,'КО',KO_FIELDS.length+FLAG_FIELDS.length+CHANNEL_FIELDS.length,'Наименования, флаги, категория, каналы')+routeCard(r,'РЦ',RC_FIELDS.length,'ВГХ, БЕИ, сканер и ГУ1–ГУ4')+routeCard(r,'Импорт',IMPORT_FIELDS.length,'Страна, ТНВЭД, тара и утильсбор')+routeCard(r,'УЦП',UCP_FIELDS.length+CAT_FIELDS.length,'Хранение, состав, маркировка, категория')+'</div></section><section class="card panel"><div class="panel-head"><div><h2>История заявки</h2><p>Каждый переход и решение фиксируются</p></div></div>'+timeline(r.history)+'</section><div class="action-bar"><button class="btn" data-action="nav" data-screen="requests">Назад</button><button class="btn danger" data-action="reject-request">Отклонить</button><button class="btn" data-action="accept-request">Принять и создать черновик</button><button class="btn primary" data-action="start-route">Запустить задания отделам</button></div></div><aside class="request-side"><section class="card side-stat"><h3>Контроль ОМД</h3><div class="side-stat-row"><span>Тип заявки</span><b>'+r.type+'</b></div><div class="side-stat-row"><span>Дубликат по GTIN</span><b>'+(r.id==='r2'?'Связано с '+(r.primary['Код 1С']||''):'Не найден')+'</b></div><div class="side-stat-row"><span>Черновик SKU</span><b>'+(r.linkedSku&&skuBy(r.linkedSku)?skuBy(r.linkedSku).version:'Не создан')+'</b></div><div class="side-stat-row"><span>Активные отделы</span><b>'+(Object.keys(r.route).filter(k=>r.route[k]).join(', ')||'—')+'</b></div></section><section class="card side-stat"><h3>Дедуп (T14)</h3><div class="timeline">'+[['ШК / GTIN','Основной ключ сопоставления'],['ПЛУ','Для товаров без ШК'],['Наим.+бренд+фасовка','Fallback-ключ'],['Зеркало MDM','Проверка против мигрированного массива']].map((x,i)=>'<div class="timeline-item '+(i<1?'done':i===1?'active':'')+'"><div class="timeline-dot">'+(i+1)+'</div><div class="timeline-copy"><b>'+x[0]+'</b><span>'+x[1]+'</span></div></div>').join('')+'</div></section><section class="card side-stat sticky-actions"><button class="btn" data-action="open-sku" data-id="'+(r.linkedSku||'')+'">Открыть черновик SKU</button><button class="btn primary" data-action="start-route">Назначить задания</button></section></aside></div>'}
function tasksView(){let rows=tasks;if(state.taskFilter!=='Все')rows=rows.filter(t=>t.assignee===state.taskFilter);if(!state.role.includes('ОМД')&&!state.role.includes('Администратор')){const role=state.role.startsWith('УЦП')?'УЦП':state.role;rows=rows.filter(t=>t.assignee===role)}return head('Задания отделов','ОМД создаёт задания из заявки. Каждый отдел видит только свой блок и работает параллельно (ВИ 3.3.6).','<button class="btn">'+icon('download')+'Экспорт xls</button>')+'<div class="filters"><input class="filter-input" placeholder="Товар, заявка, блок"><select class="filter-select" data-task-filter><option>Все</option>'+['КО','РЦ','Импорт','УЦП','ОМД'].map(x=>'<option '+(state.taskFilter===x?'selected':'')+'>'+x+'</option>').join('')+'</select><span class="filter-spacer"></span><span class="status blue">Роль: '+state.role+'</span></div><div class="card table-wrap"><table class="data-table"><thead><tr><th>Заявка / SKU</th><th>Блок задания</th><th>Исполнитель</th><th>Полей</th><th>Дедлайн (Ф2)</th><th>Статус</th><th></th></tr></thead><tbody>'+rows.map(t=>{const s=skuBy(t.sku),r=reqBy(t.request);return '<tr><td><button class="link-row" data-action="open-request" data-id="'+(r?r.id:'')+'"><span class="row-title">'+(s?s.name:'—')+'</span><span class="sub">'+(r?r.number:'')+' · источник ЛКП</span></button></td><td><b>'+t.block+'</b><span class="sub">Владелец: '+t.assignee+'</span></td><td>'+t.person+'</td><td><span class="scope-badge">'+t.fields+'</span></td><td style="font-weight:750;color:'+(t.deadline.includes('Просроч')?'var(--red)':'inherit')+'">'+t.deadline+'</td><td><span class="status '+statusClass(t.status)+'">'+t.status+'</span></td><td><button class="btn small primary" data-action="open-sku" data-id="'+(s?s.id:'')+'">Заполнить</button></td></tr>'}).join('')+'</tbody></table></div><section class="card panel" style="margin-top:16px"><div class="panel-head"><div><h2>Логика доступа</h2><p>Плоская матрица «роль × действие × блок» (без наследования, §3.2)</p></div></div><div class="grid-2 equal"><div class="rule ok"><div class="rule-icon">✓</div><div><b>Свой блок</b><span>Редактирование, сохранение черновика и отправка на проверку.</span></div></div><div class="rule"><div class="rule-icon">🔒</div><div><b>Чужой блок</b><span>Значения видны для контекста, но поля заблокированы (БП336.2).</span></div></div></div></section>'}
function skuCard(s){return '<article class="card sku-card"><div class="sku-card-top"><span class="status '+statusClass(s.status)+'">'+s.status+'</span><span class="scope-badge">'+s.version+'</span></div><h3>'+s.name+'</h3><p>'+s.supplier+'</p><div class="sku-meta"><span>GTIN <b>'+s.barcode+'</b></span><span>Код 1С <b>'+s.code+'</b></span><span>Источник <b>'+s.source+'</b></span><span>Категория <b>'+s.category+'</b></span></div><div class="progress '+(s.progress===100?'green':'')+'" style="margin-top:12px"><i style="width:'+s.progress+'%"></i></div><div class="sku-card-foot"><span>'+s.progress+'% · DQ '+s.dq+'</span><button class="btn small primary" data-action="open-sku" data-id="'+s.id+'">Открыть</button></div></article>'}
function skusView(){const q=state.search.toLowerCase();return head('Карточки SKU','Черновики создаются из принятых заявок ЛКП или Excel-импорта; опубликованные меняются только через новую версию.','<button class="btn" data-action="nav" data-screen="import">'+icon('upload')+'Excel-импорт</button>')+'<div class="filters"><input class="filter-input" placeholder="Код, GTIN, наименование" data-sku-search value="'+esc(state.search)+'"><select class="filter-select"><option>Все статусы</option><option>Черновик из заявки</option><option>Заполнение отделами</option><option>Опубликовано</option><option>Мигрировано</option></select><span class="filter-spacer"></span><span class="scope-badge red">Ручное создание SKU отключено</span></div><div class="sku-grid">'+skus.filter(s=>!q||(s.name+' '+s.barcode+' '+s.code).toLowerCase().includes(q)).map(s=>skuCard(s)).join('')+'</div><div class="scope-note" style="margin-top:16px">Новая карточка появляется через принятую заявку ЛКП или валидированный Excel-импорт. Для опубликованного SKU создаётся запрос изменения, а не прямое редактирование Golden Record.</div>'}

function ownerCls(o){return o==='КО'?'ko':o==='РЦ'?'rc':o==='Импорт'?'import':'ucp'}
function sampleValue(field,s,i){const map={'Штрихкод':s.barcode,'Штрих код':s.barcode,'Наименование полное (RU)':s.name,'Наименование (RU)':s.name,'Категория':s.category,'Страна происхождения':'Кыргызстан','Бренд':'Ак-Сүт','Бренд номенклатуры':'Ак-Сүт','Код ТНВЭД':'0401209109','Базовая единица измерения (БЕИ)':'шт'};return map[field]!=null?map[field]:(i%7===0?'Заполнено':i%5===0?'1,000':'')}
function fieldRows(fields,s,owner){const can=ownerCanEdit(owner,s);return '<div class="field-grid-catalog">'+fields.map((f,i)=>{const ret=s.returns.find(x=>x.dept===owner&&x.field===f);const changed=s.published&&i<2;const cls=!can?'locked':ret?'returned':changed?'changed':'';return '<div class="field-row '+cls+'"><label><span>'+esc(f)+'</span><span class="field-owner '+ownerCls(owner)+'">'+owner+'</span></label><input value="'+esc(sampleValue(f,s,i))+'" '+(can?'':'disabled')+' placeholder="'+(can?'Введите значение':'Только просмотр')+'">'+(ret?'<span class="sub" style="color:var(--red);margin-top:6px">Возврат ОМД: '+esc(ret.reason)+'</span>':'')+'</div>'}).join('')+'</div>'}
function blockView(s,key){const b=BLOCKS[key];const can=ownerCanEdit(b.owner,s);return '<div class="dept-toolbar"><span class="scope-badge '+(b.owner==='КО'?'blue':b.owner==='РЦ'?'green':b.owner==='Импорт'?'amber':'amber')+'">Владелец: '+b.owner+'</span><span class="scope-badge">'+b.fields.length+' полей</span><span class="scope-badge '+(can?'green':'red')+'">'+(can?'Редактирование доступно':'Только просмотр')+'</span><span class="spacer"></span>'+(!s.published?'<button class="btn" data-action="save-draft">Сохранить черновик</button><button class="btn primary" data-action="complete-block" '+(can?'':'disabled')+'>Завершить блок</button>':'')+'</div><div class="scope-note">'+b.desc+'. Другие отделы видят значения, но не могут менять чужой блок (БП336.2). ОМД возвращает конкретное поле с причиной.</div><div class="field-catalog"><section class="field-group"><div class="field-group-head"><div><h3>'+b.title+'</h3><p>Владелец блока — '+b.owner+'</p></div><span class="scope-badge green">В MDM</span></div>'+fieldRows(b.fields,s,b.owner)+'</section></div>'}
function packagingTab(s){const can=ownerCanEdit('РЦ',s);const cols=['Уровень','Кол-во БЕИ','Вес брутто/нетто','В×Ш×Г / Объём','Ш/К · Граница округл.'];const gus=['ГУ1','ГУ2','ГУ3','ГУ4'];return '<div class="dept-toolbar"><span class="scope-badge green">Владелец: РЦ</span><span class="scope-badge">Блок 6 · табличный</span><span class="scope-badge '+(can?'green':'red')+'">'+(can?'Редактирование доступно':'Только просмотр')+'</span></div><div class="scope-note">Упаковки: первичная (БЕИ) и групповая ГУ1–ГУ4 (от потребительской к транспортной, T5). У каждого уровня — ВГХ, Ш/К, кол-во БЕИ и граница округления.</div><div class="card table-wrap"><table class="data-table"><thead><tr>'+cols.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>'+gus.map((g,i)=>'<tr><td><b>'+g+'</b></td><td><input style="width:80px" '+(can?'':'disabled')+' value="'+(can?'':'')+(i===0?'12':'')+'"></td><td><input style="width:120px" '+(can?'':'disabled')+' placeholder="кг"></td><td><input style="width:150px" '+(can?'':'disabled')+' placeholder="м / м³"></td><td><input style="width:150px" '+(can?'':'disabled')+' placeholder="Ш/К · округл."></td></tr>').join('')+'</tbody></table></div>'}
function overviewTab(s){const r=requests.find(x=>x.linkedSku===s.id);return '<div class="grid-2"><section class="card panel"><div class="panel-head"><div><h2>Маршрут и задания</h2><p>Созданы ОМД из входящей заявки</p></div></div>'+workflow(s.published?6:s.status.includes('Мигр')?1:2)+'<div class="mini-task-list" style="margin-top:13px">'+(tasks.filter(t=>t.sku===s.id).map(t=>'<div class="mini-task"><i class="dept-dot"></i><div><b>'+t.block+'</b><span>'+t.person+' · '+t.status+'</span></div><span class="scope-badge">'+t.fields+' полей</span></div>').join('')||'<div class="scope-note">Задания ещё не созданы. ОМД должен завершить маршрутизацию заявки.</div>')+'</div></section><section class="card panel"><div class="panel-head"><div><h2>Контроль качества</h2><p>Quality gate до публикации</p></div></div><div class="rule-list"><div class="rule '+(s.dq>90?'ok':'warn')+'"><div class="rule-icon">'+s.dq+'</div><div><b>DQ score</b><span>Обязательность, форматы, единицы, справочники и бизнес-правила.</span></div></div><div class="rule '+(s.returns.length?'warn':'ok')+'"><div class="rule-icon">'+s.returns.length+'</div><div><b>Точечные возвраты</b><span>Открытые замечания по конкретным полям.</span></div></div><div class="rule '+(s.published?'ok':'')+'"><div class="rule-icon">GR</div><div><b>Golden Record</b><span>'+(s.published?'Действующая версия защищена от прямого изменения.':'Формируется после согласования ОМД.')+'</span></div></div></div></section></div>'+(r?'<section class="card panel" style="margin-top:16px"><div class="panel-head"><div><h2>Связанная заявка</h2><p>'+r.number+' · '+r.type+'</p></div><button class="btn small" data-action="open-request" data-id="'+r.id+'">Открыть заявку</button></div>'+primaryItems(Object.fromEntries(Object.entries(r.primary).slice(0,6)))+'</section>':'')}
function sourceTab(s){const r=requests.find(x=>x.linkedSku===s.id);return '<section class="card panel"><div class="source-banner lkp"><div class="source-badge">ЛКП</div><div><b>Неизменяемый снимок первичных данных поставщика</b><span>Введено источником на момент подачи заявки. Правки отделов и Golden Record хранятся отдельно (аудит-трейл).</span></div></div>'+(r?primaryItems(r.primary):'<div class="scope-note">Карточка создана '+s.source+', связанной заявки ЛКП нет.</div>')+'</section>'}
function categoryTab(s){return '<div class="scope-note">Блок 9 · динамический набор атрибутов зависит от категории «'+s.category+'» (условная обязательность, ВИ 3.3.5 / T2). Дерево категорий — TBD §8.</div>'+blockView(s,'category')}
function correctionTab(s){const linked=requests.filter(r=>r.linkedSku===s.id&&r.correction);return '<section class="card panel"><div class="panel-head"><div><h2>Изменения карточки</h2><p>Точечные возвраты и заявки на изменение опубликованного SKU</p></div>'+(s.published?'<button class="btn primary" data-action="open-change">Создать запрос изменения</button>':'<button class="btn" data-action="open-return">Вернуть поле</button>')+'</div>'+(s.published?'<div class="correction-banner"><div class="kpi-icon">'+icon('edit')+'</div><div><b>Прямое редактирование Golden Record запрещено (БП3310.3)</b><span>Создаётся рабочая версия, запускаются DQ и повторное согласование. Опубликованная версия действует до ack 1С.</span></div></div>':'')+(s.returns.length?'<div class="table-wrap" style="margin-top:14px"><table class="data-table"><thead><tr><th>Блок</th><th>Поле</th><th>Причина</th><th>Статус</th></tr></thead><tbody>'+s.returns.map(x=>'<tr><td><b>'+x.dept+'</b></td><td>'+x.field+'</td><td>'+x.reason+'</td><td><span class="status amber">На доработке</span></td></tr>').join('')+'</tbody></table></div>':'<div class="scope-note" style="margin-top:14px">Открытых точечных возвратов нет.</div>')+(linked.map(correctionDiff).join(''))+'</section>'}
function historyTab(s){return '<div class="grid-2"><section class="card panel"><div class="panel-head"><div><h2>История изменений</h2><p>Кто, когда, поле, старое → новое, источник (аудит-трейл, глубина 1 год)</p></div></div>'+timeline(s.history)+'</section><section class="card panel"><div class="panel-head"><div><h2>Версии</h2><p>Рабочая версия и Golden Record; откат — Ф2</p></div></div><div class="version-list"><div class="version-card"><div class="version-num">'+(s.version.includes('GR')?'GR':s.version.includes('Зерк')?'M':'W')+'</div><div class="version-copy"><b>'+s.version+' · текущая</b><span>'+s.status+'</span><p>'+(s.published?'Защищена от прямого редактирования. Следующее изменение создаст новую рабочую версию.':'Редактируется владельцами блоков, затем DQ и ОМД.')+'</p></div></div>'+(s.published?'<div class="version-card"><div class="version-num">v5</div><div class="version-copy"><b>Golden Record (архив)</b><span>Предыдущая версия</span><p>Сохранена для просмотра и аудита; откат предусмотрен в Фазе 2.</p></div></div>':'')+'</div></section></div>'}
function skuTabView(s){const t=state.skuTab;if(t==='overview')return overviewTab(s);if(t==='source')return sourceTab(s);if(t==='ko')return blockView(s,'ko');if(t==='flags')return blockView(s,'flags');if(t==='import')return blockView(s,'import');if(t==='rc')return blockView(s,'rc');if(t==='packaging')return packagingTab(s);if(t==='channels')return blockView(s,'channels');if(t==='ucp')return blockView(s,'ucp');if(t==='category')return categoryTab(s);if(t==='correction')return correctionTab(s);return historyTab(s)}
function skuView(){const s=skuBy(state.activeSku)||skus[0];return '<div class="sku-shell"><section class="card sku-summary"><div class="sku-summary-top"><div><span class="status '+statusClass(s.status)+'">'+s.status+'</span><h1>'+s.name+'</h1><p>'+s.supplier+' · Источник: '+s.source+'</p><div class="summary-tags"><span class="meta-chip">GTIN: <b>'+s.barcode+'</b></span><span class="meta-chip">Код 1С: <b>'+s.code+'</b></span><span class="meta-chip">Версия: <b>'+s.version+'</b></span><span class="meta-chip">Маршрут: <b>'+s.route.join(' + ')+'</b></span></div></div><div class="sku-action-row"><button class="btn" data-action="nav" data-screen="skus">Назад</button>'+(s.published?'<button class="btn primary" data-action="open-change">'+icon('edit')+'Создать запрос изменения</button>':'<button class="btn" data-action="open-return">Вернуть поле</button><button class="btn primary" data-action="approve-sku">Отправить ОМД</button>')+'</div></div><div class="completion"><div><div class="progress '+(s.progress===100?'green':'')+'"><i style="width:'+s.progress+'%"></i></div><span>Полнота активных блоков · DQ '+s.dq+'/100</span></div><b>'+s.progress+'%</b></div></section><nav class="tabs">'+SKU_TABS.map(t=>'<button class="tab '+(state.skuTab===t[0]?'active':'')+'" data-action="sku-tab" data-tab="'+t[0]+'"><i class="dot '+(s.returns.length&&t[0]==='correction'?'warn':'')+'"></i>'+t[1]+'</button>').join('')+'</nav>'+skuTabView(s)+'</div>'}
function correctionsView(){const r=reqBy('r2'),s=skuBy('sku3');return head('Изменения и версии','Ни поставщик, ни сотрудник не перезаписывает действующий Golden Record напрямую (ВИ 3.3.11).','<button class="btn primary" data-action="open-change" data-id="sku3">'+icon('plus')+'Новый запрос изменения</button>')+'<div class="kpis"><div class="card kpi"><b>'+requests.filter(r=>r.type.includes('Измен')).length+'</b><span>Заявки на изменение из ЛКП</span></div><div class="card kpi"><b>'+skus.reduce((a,s)=>a+s.returns.length,0)+'</b><span>Точечных возврата</span></div><div class="card kpi"><b>'+skus.filter(s=>!s.published&&/v[2-9]/.test(s.version)).length+'</b><span>Рабочих версий после публикации</span></div><div class="card kpi"><b>0</b><span>Прямых изменений GR</span></div></div><section class="card panel"><div class="panel-head"><div><h2>Входящее изменение из ЛКП</h2><p>'+r.number+' · опубликованный SKU '+s.code+'</p></div><button class="btn small primary" data-action="open-request" data-id="r2">Разобрать заявку</button></div>'+correctionDiff(r)+'</section><div class="grid-2 equal" style="margin-top:16px"><section class="card panel"><div class="panel-head"><div><h2>Точечные возвраты ОМД</h2><p>Остальные блоки остаются согласованными</p></div></div><div class="mini-task-list">'+(skus.flatMap(s=>s.returns.map(x=>({s,x}))).map(o=>'<div class="mini-task"><i class="dept-dot"></i><div><b>'+o.s.name+'</b><span>'+o.x.dept+' · '+o.x.field+' · '+o.x.reason+'</span></div><button class="btn small" data-action="open-sku" data-id="'+o.s.id+'">Открыть</button></div>').join('')||'<div class="scope-note">Открытых возвратов нет.</div>')+'</div></section><section class="card panel"><div class="panel-head"><div><h2>Правило версий</h2><p>Опубликованная и рабочая версии живут параллельно</p></div></div><div class="rule-list"><div class="rule ok"><div class="rule-icon">GR</div><div><b>Действующая версия</b><span>Используется в 1С до публикации изменения.</span></div></div><div class="rule warn"><div class="rule-icon">W</div><div><b>Рабочая версия</b><span>Проходит задания владельцев, DQ и согласование ОМД.</span></div></div><div class="rule"><div class="rule-icon">ack</div><div><b>Замена версии</b><span>Только после ack 1С новая версия становится Golden Record.</span></div></div></div></section></div>'}
function dqView(){return head('DQ и дубли','Автопроверки выполняются после заполнения блоков и перед согласованием ОМД (ВИ 3.3.7). Нечёткий matching — Ф2.','<button class="btn primary" data-action="run-dq">Запустить DQ</button>')+'<div class="grid-2"><section class="card panel"><div class="panel-head"><div><h2>Quality gate</h2><p>Публикация блокируется при ошибках (БП337.2)</p></div></div><div class="rule-list">'+[['Обязательные поля по типу/категории','178 / 184 правил'],['GTIN и контрольная цифра','Без ошибок'],['Вес брутто ≥ нетто; размеры > 0','2 предупреждения'],['Дубли по ключам ШК→ПЛУ→наим+бренд','1 кандидат']].map((x,i)=>'<div class="rule '+(i<2?'ok':i===2?'warn':'bad')+'"><div class="rule-icon">'+(i<2?'✓':i===2?'!':'×')+'</div><div><b>'+x[0]+'</b><span>'+x[1]+'</span></div></div>').join('')+'</div></section><section class="card panel"><div class="panel-head"><div><h2>Список дубликатов</h2><p>Ручной разбор ОМД (программное удаление запрещено, БП337.1)</p></div></div><div class="compare"><div class="compare-card"><h3>Заявка из ЛКП</h3><div class="compare-row"><span>GTIN</span><b>4870122203147</b></div><div class="compare-row"><span>Товар</span><b>Вода питьевая «Легенда»</b></div><div class="compare-row"><span>Код 1С</span><b>—</b></div></div><div class="compare-card"><h3>Зеркало MDM (Golden Record)</h3><div class="compare-row"><span>Код 1С</span><b>Ц00043118</b></div><div class="compare-row"><span>GTIN</span><b>4870122203147</b></div><div class="compare-row"><span>Совпадение</span><b>по основному ключу ШК</b></div></div></div><div class="scope-note" style="margin-top:12px">Основная карточка ждёт и НЕ публикуется, пока дубль не устранён вручную (объединить / пометить / провести).</div><button class="btn primary" style="margin-top:6px" data-action="open-request" data-id="r2">Открыть как изменение</button></section></div>'}
function approvalView(){const rows=skus.filter(s=>!s.published&&s.progress>60);return head('Согласование ОМД','ОМД проверяет карточку целиком, но возвращает адресно: блок + поле + причина (БП338.2). Частичной публикации нет.','')+'<div class="card table-wrap"><table class="data-table"><thead><tr><th>Карточка</th><th>Версия</th><th>DQ</th><th>Возвраты</th><th>Статус</th><th></th></tr></thead><tbody>'+rows.map(s=>'<tr><td><b>'+s.name+'</b><span class="sub">'+s.barcode+'</span></td><td>'+s.version+'</td><td><span class="status '+(s.dq>90?'green':'amber')+'">'+s.dq+'/100</span></td><td>'+s.returns.length+'</td><td><span class="status '+statusClass(s.status)+'">'+s.status+'</span></td><td><button class="btn small primary" data-action="open-sku" data-id="'+s.id+'">Проверить</button></td></tr>').join('')+'</tbody></table></div>'}
function goldenView(){const published=skus.filter(s=>s.published&&!s.status.includes('Мигр'));return head('Golden Record','Эталон формируется по source-routing: каждое значение — от владельца блока (БП339.1). Классический survivorship не применяется.','')+'<div class="grid-2"><section class="card panel"><div class="panel-head"><div><h2>Готово к 1С</h2><p>Quality gate пройден, ожидается публикация в «Холдинг»</p></div></div><div class="mini-task-list"><div class="mini-task"><i class="dept-dot"></i><div><b>Сыр плавленый «Чабрец» 180 г</b><span>GR v1 · 100% · DQ 100</span></div><button class="btn small primary" data-action="publish-1c">Опубликовать</button></div></div><div class="scope-note" style="margin-top:12px">Публикация один раз в «Холдинг» (БП3310.2); распространение по базам сетей — на стороне 1С.</div></section><section class="card panel"><div class="panel-head"><div><h2>Опубликованные версии</h2><p>Получен обратный код 1С (Ц…)</p></div></div><div class="version-list">'+published.map(s=>'<div class="version-card"><div class="version-num">GR</div><div class="version-copy"><b>'+s.name+'</b><span>'+s.code+' · '+s.version+'</span><p>Изменение — только через новую рабочую версию.</p></div><button class="btn small" data-action="open-sku" data-id="'+s.id+'">Открыть</button></div>').join('')+'</div></section></div>'}
function journalView(){return head('Обмен с 1С','Собственный механизм гарантированной доставки: outbox, retry, ack, DLQ, обратный код (шины/ESB нет, §6.4).','<button class="btn">Повторить ошибки</button>')+'<div class="source-banner cut"><div class="source-badge">↔</div><div><b>Обратный поток 1С→MDM минимизирован</b><span>Из 1С приходят только: обратный код Ц… (по событию), разовая миграция и временная ночная сверка-дельта по «Холдингу». Полной двусторонней синхронизации нет.</span></div></div><div class="card table-wrap"><table class="data-table"><thead><tr><th>Время</th><th>Код 1С</th><th>Событие</th><th>Статус</th><th>Попытки</th></tr></thead><tbody>'+journal.map(x=>'<tr><td>'+x[0]+'</td><td><b>'+x[1]+'</b></td><td>'+x[2]+'</td><td><span class="status '+statusClass(x[3])+'">'+x[3]+'</span></td><td>'+x[4]+'</td></tr>').join('')+'</tbody></table></div>'}
function importView(){return head('Массовый Excel-импорт','Импорт создаёт входящий пакет, но карточки проходят те же DQ и quality gate, что и созданные вручную (БП3313.1).','')+'<div class="grid-2"><section class="card panel"><div class="panel-head"><div><h2>Загрузить шаблон</h2><p>Маппинг колонок к атрибутам MDM</p></div></div><div class="upload-zone"><div class="upload-icon">'+icon('upload')+'</div><h3>'+(state.imported?'Доп.свойства_отделов.xlsx':'Перетащите Excel-файл')+'</h3><p>'+(state.imported?'Листы: КО, РЦ, Импорт, УЦП':'Поддерживаются .xlsx и утверждённый шаблон')+'</p><button class="btn primary" data-action="choose-file">Выбрать файл</button></div></section><section class="card panel"><div class="panel-head"><div><h2>Результат чтения</h2><p>Столбцы распределены по владельцам блоков</p></div></div><div class="metric-list">'+[['КО (идент.+флаги+каналы)',KO_FIELDS.length+FLAG_FIELDS.length+CHANNEL_FIELDS.length],['РЦ (ВГХ, сканер)',RC_FIELDS.length],['Импорт (тара, утильсбор)',IMPORT_FIELDS.length],['УЦП (хранение, категория)',UCP_FIELDS.length+CAT_FIELDS.length]].map(x=>'<div class="metric-row"><div><b>'+x[0]+'</b></div><span class="metric-num">'+x[1]+'</span></div>').join('')+'</div><button class="btn primary" style="width:100%;margin-top:12px" data-action="process-import" '+(state.imported?'':'disabled')+'>Проверить и создать пакет</button></section></div>'+(state.importProcessed?'<section class="card panel" style="margin-top:16px"><div class="scope-note">Пакет валидирован. Корректные строки создаются как входящие карточки с задачами отделам; ошибочные выгружаются отдельным Excel-файлом с причинами.</div><button class="btn primary" data-action="accept-import">Принять пакет</button></section>':'')}
function nsiView(){return head('НСИ и атрибуты','Мастер справочников и настроек атрибутов — MDM (§3.4.3). Что тянется из 1С — уточняется маппингом (TBD T1).','<button class="btn primary" data-action="add-nsi">Добавить значение</button>')+'<div class="grid-2"><section class="card panel"><div class="panel-head"><div><h2>Справочники</h2></div></div><div class="directory-list">'+Object.keys(directories).map(k=>'<button class="directory-item '+(state.selectedDir===k?'active':'')+'" data-action="select-dir" data-dir="'+k+'"><span>'+k+'</span><b>'+directories[k].length+'</b></button>').join('')+'</div></section><section class="card panel"><div class="panel-head"><div><h2>'+state.selectedDir+'</h2><p>Значения НСИ · мастер MDM</p></div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Наименование</th><th>Статус</th></tr></thead><tbody>'+directories[state.selectedDir].map(v=>'<tr><td><b>'+v+'</b></td><td><span class="status green">Активно</span></td></tr>').join('')+'</tbody></table></div></section></div>'}
function reportsView(){return head('Отчёты MDM','Счётчики по статусам, «где карточки», «на доработке», «готово к 1С», «ошибки обмена». Выгрузка в xls (§3.4.5).','<button class="btn primary">'+icon('download')+'Выгрузить xls</button>')+'<div class="kpis"><div class="card kpi"><b>'+requests.length+'</b><span>Входящие заявки</span></div><div class="card kpi"><b>'+tasks.length+'</b><span>Задания создано</span></div><div class="card kpi"><b>'+skus.reduce((a,s)=>a+s.returns.length,0)+'</b><span>Возвраты</span></div><div class="card kpi"><b>'+skus.filter(s=>s.published).length+'</b><span>Опубликованные GR</span></div></div><div class="grid-2 equal"><section class="card panel"><div class="panel-head"><div><h2>Нагрузка отделов</h2></div></div><div class="metric-list">'+['КО','РЦ','Импорт','УЦП','ОМД'].map(d=>'<div class="metric-row"><div><b>'+d+'</b><span>активные задания</span></div><span class="metric-num">'+tasks.filter(t=>t.assignee===d&&!t.status.includes('Заверш')).length+'</span></div>').join('')+'</div></section><section class="card panel"><div class="panel-head"><div><h2>Типы входящих событий</h2></div></div><div class="metric-list"><div class="metric-row"><div><b>Новый SKU</b><span>из ЛКП</span></div><span class="metric-num">'+requests.filter(r=>r.type==='Новый SKU').length+'</span></div><div class="metric-row"><div><b>Изменение SKU</b><span>без перезаписи GR</span></div><span class="metric-num">'+requests.filter(r=>r.type.includes('Измен')).length+'</span></div><div class="metric-row"><div><b>Excel-пакеты</b><span>массовый импорт</span></div><span class="metric-num">1</span></div></div></section></div>'}
function suppliersView(){return head('Поставщики (ЛКП)','Учётные записи поставщиков создаёт внутренний сотрудник (ВИ 3.3.1). Ключ связи во всех системах — код контрагента 1С (Ц…, T7).','<button class="btn primary" data-action="open-create-supplier">'+icon('plus')+'Создать поставщика</button>')+'<div class="source-banner lkp"><div class="source-badge">Ц…</div><div><b>Сквозной ключ поставщика</b><span>Код контрагента формата Ц… назначается в 1С при заведении контрагента и связывает поставщика в ЛКП, MDM, Питон и 1С. Мастер справочника контрагентов — 1С (в Ф3 — перенос в MDM).</span></div></div><div class="card table-wrap"><table class="data-table"><thead><tr><th>Поставщик</th><th>Код контрагента 1С</th><th>Тип</th><th>Ввод</th><th>E-mail (уведомления)</th><th>Статус</th><th></th></tr></thead><tbody>'+suppliers.map(s=>'<tr><td><div class="source-cell"><span class="source-mini lkp">'+s.name.replace(/[^А-ЯA-Z]/g,'').slice(0,2)+'</span><div><b>'+s.name+'</b><span class="sub">Логин: '+s.login+'</span></div></div></td><td><b>'+s.code+'</b></td><td>'+s.type+'</td><td><span class="scope-badge '+(s.via.includes('импорт')?'blue':'green')+'">'+s.via+'</span></td><td>'+s.email+'</td><td><span class="status '+statusClass(s.status)+'">'+s.status+'</span></td><td>'+(s.status==='На верификации'?'<button class="btn small primary" data-action="approve-supplier" data-id="'+s.id+'">Одобрить</button>':'<button class="btn small" data-action="goto-lkp" data-id="'+s.id+'">Кабинет</button>')+'</td></tr>').join('')+'</tbody></table></div><div class="scope-note" style="margin-top:14px">Одобрение выполняет ОМД или КО (БП331.3). После одобрения система отправляет поставщику на почту логин и ссылку/код для первого входа. Саморегистрации нет.</div>'}
function migrationView(){const migrated=skus.filter(s=>s.status.includes('Мигр'));return head('Миграция из 1С','Разовая первичная загрузка ~15 000 SKU и НСИ из базы «Холдинг» (ВИ 3.3.12). Массив становится зеркалом для проверки дублей.','<button class="btn primary" data-action="run-migration">Запустить фазу миграции</button>')+'<div class="source-banner cut"><div class="source-badge">'+icon('db')+'</div><div><b>Зеркало мастер-данных MDM</b><span>Каждой карточке присваивается статус «Мигрировано», владелец по умолчанию — ОМД, затягивается существующий код Ц…. Качество проверяется лениво (при следующем редактировании) и фоновой кампанией профилирования; мигрированные карточки не блокируются скопом (БП3312.2).</span></div></div><div class="kpis"><div class="card kpi"><b>~15 000</b><span>SKU к загрузке</span></div><div class="card kpi"><b>6 420</b><span>Загружено (фаза 1)</span></div><div class="card kpi"><b>43%</b><span>Профилировано</span></div><div class="card kpi"><b>1</b><span>Разовая (не синхронизация)</span></div></div><section class="card panel"><div class="panel-head"><div><h2>Мигрированные карточки (образец)</h2><p>Дозаполняются лениво; при редактировании обязаны пройти quality gate</p></div></div><div class="mini-task-list">'+migrated.map(s=>'<div class="mini-task"><i class="dept-dot"></i><div><b>'+s.name+'</b><span>'+s.code+' · DQ '+s.dq+' · владелец ОМД</span></div><button class="btn small primary" data-action="open-sku" data-id="'+s.id+'">Открыть</button></div>').join('')+'</div></section>'}

function lkpShell(content){const sup=supBy(state.supplier);const unread=supReqs().filter(r=>/доработ|Требует|Отклон/.test(r.status)).length;return '<div class="app lkp '+(state.menu?'menu-open':'')+'"><aside class="sidebar"><div class="brand"><div class="brand-logo">U</div><div class="brand-copy"><strong>ЛКП</strong><span>Кабинет поставщика</span></div></div><div class="side-scroll"><div class="nav-label">Поставщик</div>'+lkpNav.map(n=>'<button class="nav-btn '+(state.lkpScreen===n[0]?'active':'')+'" data-action="lkp-nav" data-screen="'+n[0]+'">'+icon(n[1])+'<span>'+n[2]+'</span>'+(n[0]==='notifications'&&unread?'<em class="badge">'+unread+'</em>':'')+'</button>').join('')+'</div><div class="side-footer"><div class="user-card"><div class="avatar">'+sup.name.replace(/[^А-ЯA-Z]/g,'').slice(0,2)+'</div><div class="user-meta"><b>'+sup.name+'</b><span>'+sup.code+'</span></div><button class="logout" data-action="logout" title="Выход">'+icon('logout')+'</button></div></div></aside><section class="workspace"><header class="topbar lkp-topbar" style="background:#fff"><button class="menu-btn" data-action="menu">'+icon('menu')+'</button><div class="breadcrumb"><strong>'+lkpTitle()+'</strong><span>Внешний контур ЛКП · '+today+'</span></div><span class="ext-ribbon">'+icon('shield')+'Внешний контур · виден только ваш ассортимент</span><span class="filter-spacer"></span><button class="btn small" data-action="goto-mdm">Внутренний MDM →</button><select class="role-select" data-supplier>'+suppliers.filter(s=>s.status==='Одобрен').map(s=>'<option value="'+s.id+'" '+(state.supplier===s.id?'selected':'')+'>'+s.name+'</option>').join('')+'</select></header><main class="page-scroll"><div class="page">'+content+'<div class="scroll-proof">Конец рабочей области · ЛКП (демо)</div></div></main></section>'+(state.modal?modalView():'')+(state.toast?'<div class="toast">'+state.toast+'</div>':'')+'</div>'}
function lkpAssortment(){const items=skus.filter(s=>s.supplierId===state.supplier);return '<div class="lkp-hero"><div class="eyebrow">Личный кабинет поставщика</div><h1>Ведите свой ассортимент и подавайте заявки</h1><p>Создайте карточку-черновик с базовыми полями и отправьте заявку на ввод позиции. Код товара присвоит 1С позже — вводить его не нужно. Статусы и запросы на доработку приходят на почту.</p></div><div class="kpis"><div class="card kpi"><div class="kpi-top"><div class="kpi-icon">'+icon('box')+'</div></div><b>'+items.length+'</b><span>Позиций в ассортименте</span></div><div class="card kpi"><div class="kpi-top"><div class="kpi-icon">'+icon('inbox')+'</div></div><b>'+supReqs().length+'</b><span>Заявок подано</span></div><div class="card kpi"><div class="kpi-top"><div class="kpi-icon">'+icon('check')+'</div></div><b>'+items.filter(s=>s.published).length+'</b><span>Заведено в 1С</span></div><div class="card kpi"><div class="kpi-top"><div class="kpi-icon">'+icon('edit')+'</div></div><b>'+supReqs().filter(r=>/доработ|Требует/.test(r.status)).length+'</b><span>Требуют доработки</span></div></div><section class="card panel"><div class="panel-head"><div><h2>Мой ассортимент</h2><p>Позиции, поданные вами, и их текущий статус в обработке</p></div><button class="btn lkp" data-action="open-add-product">'+icon('plus')+'Добавить товар</button></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Товар</th><th>Штрихкод</th><th>Код 1С</th><th>Статус обработки</th></tr></thead><tbody>'+(items.length?items.map(s=>{const r=requests.find(x=>x.linkedSku===s.id&&x.supplierId===state.supplier);const st=r?lkpStatusOf(r):(s.published?['Заведена в 1С','green']:['В обработке','blue']);return '<tr><td><b>'+s.name+'</b><span class="sub">'+s.category+'</span></td><td>'+s.barcode+'</td><td>'+s.code+'</td><td><span class="status '+st[1]+'">'+st[0]+'</span></td></tr>'}).join(''):'<tr><td colspan="4"><div class="empty"><b>Пока нет позиций</b>Нажмите «Добавить товар», чтобы function lkpRequests(){const rows=supReqs();return head('Мои заявки','Отслеживайте статусы поданных заявок. При запросе на доработку виден блок и причина.','<button class="btn lkp" data-action="open-add-product">'+icon('plus')+'Новая заявка</button>')+'<div class="card table-wrap"><table class="data-table"><thead><tr><th>Заявка</th><th>Товар</th><th>Тип</th><th>Подана</th><th>Статус</th></tr></thead><tbody>'+(rows.length?rows.map(r=>{const st=lkpStatusOf(r);return '<tr><td><b>'+r.number+'</b></td><td>'+r.name+'</td><td><span class="status '+(r.type.includes('Измен')?'amber':'blue')+'">'+r.type+'</span></td><td>'+r.received+'</td><td><span class="status '+st[1]+'">'+st[0]+'</span></td></tr>'}).join(''):'<tr><td colspan="5"><div class="empty"><b>Заявок нет</b>Подайте заявку на ввод позиции из раздела «Мой ассортимент».</div></td></tr>')+'</tbody></table></div><div class="scope-note" style="margin-top:14px">Статусы упрощены для поставщика: внутренние этапы MDM (маршрутизация, задания отделов, DQ, ОМД) отображаются как «Принята, в обработке». Детали внутреннего процесса поставщику не раскрываются (§6.5, изоляция данных).</div>'}
function lkpNotifications(){const list=[];supReqs().forEach(r=>{const st=lkpStatusOf(r);if(/доработ|Требует/.test(r.status))list.push(['Запрос на доработку',r.number+' · '+r.name+' — требуется уточнение. Подробности в заявке.','сегодня']);else if(/Опубликов|Заведен/.test(r.status))list.push(['Позиция заведена в 1С',r.number+' · '+r.name+' успешно заведена, присвоен код.','сегодня']);else list.push(['Статус заявки: '+st[0],r.number+' · '+r.name,r.received]);});return head('Уведомления','Канал уведомлений — только почта (SMS в MVP не используется, §3.4.1). Здесь показана копия писем.','')+'<section class="card panel"><div class="panel-head"><div><h2>Почтовые уведомления</h2><p>Смена статуса заявки и запросы на доработку</p></div><span class="ext-ribbon">'+icon('mail')+esc(supBy(state.supplier).email)+'</span></div><div class="mini-task-list">'+list.map(n=>'<div class="notif"><div class="n-ico">'+icon('mail')+'</div><div><b>'+n[0]+'</b><span>'+n[1]+'</span><em>'+n[2]+'</em></div></div>').join('')+'</div></section>'}
function lkpDocuments(){const sup=supBy(state.supplier);return head('Документы и АВР','Акты выполненных работ формируются и подписываются в системе «Питон». ЛКП передаёт данные и показывает статус (ВИ 3.3.14).','')+'<div class="grid-2"><section class="card panel"><div class="panel-head"><div><h2>Статусы АВР (из Питон)</h2><p>Связь по коду контрагента '+sup.code+'</p></div></div><div class="card table-wrap"><table class="data-table"><thead><tr><th>Документ</th><th>Период</th><th>Статус (Питон)</th></tr></thead><tbody><tr><td><b>АВР № 2026-07</b></td><td>Июль 2026</td><td><span class="status green">Подписан</span></td></tr><tr><td><b>АВР № 2026-08</b></td><td>Август 2026</td><td><span class="status amber">Сформирован, ожидает подписания</span></td></tr></tbody></table></div></section><section class="card panel"><div class="panel-head"><div><h2>Как это работает</h2></div></div><div class="rule-list"><div class="rule ok"><div class="rule-icon">1</div><div><b>ЛКП → Питон</b><span>Передаются данные для формирования документа по коду Ц…</span></div></div><div class="rule"><div class="rule-icon">2</div><div><b>Питон</b><span>Формирование и подписание АВР (ЭЦП, документооборот).</span></div></div><div class="rule"><div class="rule-icon">3</div><div><b>Питон → ЛКП</b><span>Возврат статуса документа для отображения поставщику.</span></div></div></div><div class="scope-note" style="margin-top:12px">Подписание и оборот АВР — вне контура MDM. MDM использует из ЛКП только мастер-данные (T9).</div></section></div>'}

 if(state.modal==='change'){const s=skuBy(state.activeSku)||skuBy('sku3');return '<div class="modal-backdrop"><div class="modal"><div class="modal-head"><div><h2>Запрос на изменение опубликованного SKU</h2><p>'+s.code+' · '+s.name+'</p></div><button class="close" data-action="close-modal">×</button></div><div class="modal-body"><div class="correction-banner"><div><b>Golden Record '+s.version+' останется действующим</b><span>Будет создана новая рабочая версия. После DQ, ОМД и ack 1С она заменит текущую.</span></div></div><div class="field-grid two" style="margin-top:14px"><div class="field"><label>Инициатор</label><select><option>ОМД</option><option>КО</option><option>РЦ</option><option>Импорт</option><option>УЦП</option><option>Поставщик (через заявку)</option></select></div><div class="field"><label>Блок</label><select id="changeDept"><option>КО</option><option>РЦ</option><option>Импорт</option><option>УЦП</option></select></div><div class="field" style="grid-column:1/-1"><label>Причина изменения</label><textarea id="changeReason">Изменение мастер-данных по подтверждённому запросу.</textarea></div></div></div><div class="modal-foot"><button class="btn" data-action="close-modal">Отмена</button><button class="btn primary" data-action="confirm-change">Создать рабочую версию</button></div></div></div>'}
 if(state.modal==='nsi'){return '<div class="modal-backdrop"><div class="modal"><div class="modal-head"><div><h2>Новое значение НСИ</h2><p>'+state.selectedDir+'</p></div><button class="close" data-action="close-modal">×</button></div><div class="modal-body"><div class="field"><label>Наименование</label><input id="nsiName" value="Новое значение"></div></div><div class="modal-foot"><button class="btn" data-action="close-modal">Отмена</button><button class="btn primary" data-action="save-nsi">Сохранить</button></div></div></div>'}
 if(state.modal==='createSupplier'){return '<div class="modal-backdrop"><div class="modal"><div class="modal-head"><div><h2>Создать учётную запись поставщика</h2><p>ВИ 3.3.1 · саморегистрации нет; одобряет ОМД/КО</p></div><button class="close" data-action="close-modal">×</button></div><div class="modal-body"><div class="field-grid two"><div class="field"><label class="required">Наименование юрлица</label><input id="csName" placeholder="ОсОО «…»"></div><div class="field"><label class="required">Налоговый номер (ИНН)</label><input placeholder="Проверка формата"></div><div class="field"><label class="required">Контактный e-mail</label><input placeholder="для логина и уведомлений"></div><div class="field"><label>Тип поставщика</label><select id="csType"><option>Локальный</option><option>Зарубежный</option></select></div><div class="field"><label>Код контрагента 1С (Ц…)</label><input placeholder="назначается в 1С"></div><div class="field"><label>Банковские реквизиты</label><input placeholder="для АВР (необяз. на MVP)"></div></div><div class="scope-note" style="margin-top:12px">После создания поставщик переходит в статус «На верификации». Одобрение отправляет на почту логин и ссылку/код для первого входа.</div></div><div class="modal-foot"><button class="btn" data-action="close-modal">Отмена</button><button class="btn primary" data-action="confirm-create-supplier">Создать (на верификацию)</button></div></div></div>'}
 if(state.modal==='addProduct'){const sup=supBy(state.supplier);return '<div class="modal-backdrop"><div class="modal"><div class="modal-head"><div><h2>Добавить товар</h2><p>ЛКП · '+sup.name+' · базовые поля идентификации (ВИ 3.3.3)</p></div><button class="close" data-action="close-modal">×</button></div><div class="modal-body"><div class="source-banner lkp" style="margin-bottom:14px"><div class="source-badge">i</div><div><b>Код товара вводить не нужно</b><span>Он будет присвоен 1С после согласования. Двуязычие — парой полей RU/KG.</span></div></div><div class="field-grid two"><div class="field"><label class="required">Наименование (RU)</label><input id="apNameRu" placeholder="Напр. Кефир «Ак-Сүт» 2,5%, 0,5 л"></div><div class="field"><label>Наименование (KG)</label><input id="apNameKg" placeholder="Кыргызча аталышы"></div><div class="field"><label class="required">Бренд</label><input id="apBrand" value="'+esc(sup.name.replace(/ОсОО |«|»/g,'').trim())+'"></div><div class="field"><label>Товарная марка</label><input id="apTm"></div><div class="field"><label class="required">Вес нетто</label><input id="apWeight" placeholder="напр. 0,5 кг"></div><div class="field"><label>Код ТНВЭД</label><input id="apTnved" placeholder="10 знаков"></div><div class="field"><label class="required">Страна происхождения</label><input id="apCountry" value="'+(sup.type==='Зарубежный'?'':'Кыргызстан')+'"></div><div class="field"><label class="required">Штрихкод (GTIN)</label><input id="apBarcode" placeholder="13 цифр"></div></div></div><div class="modal-foot"><button class="btn" data-action="save-product-draft">Сохранить черновик</button><button class="btn lkp" data-action="submit-product">Отправить заявку в MDM</button></div></div></div>'}
 return ''}
/* ===================== ROUTER ===================== */
function viewForScreen(){return ({dashboard:dashboardView,requests:requestsView,request:requestView,tasks:tasksView,skus:skusView,sku:skuView,corrections:correctionsView,dq:dqView,approval:approvalView,golden:goldenView,suppliers:suppliersView,migration:migrationView,journal:journalView,import:importView,nsi:nsiView,reports:reportsView}[state.screen]||dashboardView)()}
function render(resetScroll){if(resetScroll===undefined)resetScroll=true;const root=$('#root');if(!state.logged){root.innerHTML=loginView()}else if(state.contour==='lkp'){root.innerHTML=lkpShell(lkpView())}else{root.innerHTML=shell(viewForScreen())}bind();if(resetScroll&&state.logged){const sc=$('.page-scroll');if(sc)sc.scrollTop=0}}
function bind(){$$('[data-action]').forEach(el=>el.addEventListener('click',handleAction));
 const role=$('[data-role]');if(role)role.addEventListener('change',e=>{state.role=e.target.value;render(false)});
 const sup=$('[data-supplier]');if(sup)sup.addEventListener('change',e=>{state.supplier=e.target.value;state.lkpScreen='assortment';render()});
 const rf=$('[data-request-filter]');if(rf)rf.addEventListener('change',e=>{state.requestFilter=e.target.value;render()});
 const tf=$('[data-task-filter]');if(tf)tf.addEventListener('change',e=>{state.taskFilter=e.target.value;render()});
 const gs=$('[data-global-search]');if(gs)gs.addEventListener('keydown',e=>{if(e.key==='Enter'){state.search=e.target.value;state.screen='skus';render()}});
 const ss=$('[data-sku-search]');if(ss)ss.addEventListener('keydown',e=>{if(e.key==='Enter'){state.search=e.target.value;render()}})}
function nextNum(){return 'LKP-2026-00'+(482+requests.filter(r=>r.number.startsWith('LKP-2026-005')||parseInt(r.number.slice(-5))>=482).length)}
function handleAction(e){const b=e.currentTarget,a=b.dataset.action;
 if(a==='pick-contour'){state.contour=b.dataset.c;render();return}
 if(a==='login'){state.logged=true;state.contour=b.dataset.c||state.contour||'mdm';if(state.contour==='lkp'){state.lkpScreen='assortment'}else{state.screen='dashboard'}render();return}
 if(a==='logout'){state.logged=false;state.contour=null;render();return}
 if(a==='menu'){state.menu=!state.menu;render(false);return}
 if(a==='goto-lkp'){state.contour='lkp';state.logged=true;if(b.dataset.id)state.supplier=b.dataset.id;state.lkpScreen='assortment';render();return}
 if(a==='goto-mdm'){state.contour='mdm';state.logged=true;state.screen='requests';render();return}
 if(a==='nav'){state.screen=b.dataset.screen;state.menu=false;render();return}
 if(a==='lkp-nav'){state.lkpScreen=b.dataset.screen;state.menu=false;render();return}
 if(a==='open-request'){if(!b.dataset.id)return;state.activeRequest=b.dataset.id;state.screen='request';state.menu=false;render();return}
 if(a==='open-sku'){if(!b.dataset.id){toast('Черновик ещё не создан');return}state.activeSku=b.dataset.id;state.screen='sku';state.skuTab='overview';render();return}
 if(a==='sku-tab'){state.skuTab=b.dataset.tab;render(false);return}
 if(a==='toggle-route'){const r=reqBy(state.activeRequest);r.route[b.dataset.dept]=b.checked;render(false);return}
 if(a==='accept-request'){const r=reqBy(state.activeRequest);r.status='Готово к маршрутизации';r.history.push([today+' · 14:31','ОМД','Первичная проверка завершена; черновик подтверждён']);const s=skuBy(r.linkedSku);if(s)s.status='Черновик подтверждён ОМД';toast('Заявка принята. Можно запускать маршрут');return}
 if(a==='start-route'){const r=reqBy(state.activeRequest);r.status='Маршрутизировано';r.history.push([today+' · 14:33','ОМД','Созданы параллельные задания отделам']);const s=skuBy(r.linkedSku);if(s){s.status='Заполнение отделами';s.route=Object.keys(r.route).filter(k=>r.route[k])}Object.keys(r.route).filter(k=>r.route[k]).forEach(d=>{if(!tasks.some(t=>t.request===r.id&&t.assignee===d))tasks.push({id:'t'+(tasks.length+1),sku:r.linkedSku,request:r.id,block:d+' · блок атрибутов',assignee:d,person:(employees[d]||employees.ОМД)[0],fields:d==='КО'?KO_FIELDS.length:d==='РЦ'?RC_FIELDS.length:d==='Импорт'?IMPORT_FIELDS.length:UCP_FIELDS.length,priority:r.priority,deadline:'01.08.2026',status:'Новая'})});state.screen='tasks';toast('Задания созданы и распределены между отделами');return}
 if(a==='reject-request'){const r=reqBy(state.activeRequest);r.status='Отклонено ОМД';r.history.push([today+' · 14:30','ОМД','Заявка отклонена; уведомление поставщику по почте']);toast('Заявка отклонена; поставщик уведомлён');return}
 if(a==='open-return'){state.modal='return';render(false);return}
 if(a==='confirm-return'){const s=skuBy(state.activeSku);const dept=($('#retDept')||{}).value||'РЦ',field=($('#retField')||{}).value||'Масса со сканера',reason=($('#retReason')||{}).value||'Уточнить значение';s.returns.push({dept,field,reason});s.status='На доработке: '+dept;s.history.push([today+' · 14:35','ОМД','Возврат: '+dept+' · '+field]);const r=requests.find(x=>x.linkedSku===s.id);if(r){r.status='Требуется доработка ('+dept+')';r.history.push([today+' · 14:35','MDM→ЛКП','Запрос на доработку отправлен поставщику по почте'])}state.modal=null;toast('Поле возвращено в '+dept+'; поставщик уведомлён');return}
 if(a==='open-change'){if(b.dataset.id)state.activeSku=b.dataset.id;state.modal='change';render(false);return}
 if(a==='confirm-change'){const s=skuBy(state.activeSku);s.published=false;s.version='Рабочая v'+(parseInt((s.version.match(/\d+/)||['1'])[0])+1);s.status='Запрос изменения · заполнение '+(($('#changeDept')||{}).value||'КО');s.progress=72;s.dq=80;s.history.push([today+' · 14:38',state.role,'Создана новая рабочая версия; действующий GR сохранён']);state.modal=null;toast('Рабочая версия создана. Golden Record не изменён');return}
 if(a==='save-draft'){const s=skuBy(state.activeSku);s.history.push([today+' · 14:40',state.role,'Сохранён черновик блока']);toast('Черновик блока сохранён');return}
 if(a==='complete-block'){const s=skuBy(state.activeSku);s.progress=Math.min(100,s.progress+15);s.history.push([today+' · 14:41',state.role,'Блок завершён и отправлен ОМД']);toast('Блок завершён. Полнота пересчитана');return}
 if(a==='approve-sku'){const s=skuBy(state.activeSku);if(s.returns.length){toast('Сначала устраните открытые точечные возвраты');return}s.status='На согласовании ОМД';s.dq=Math.max(s.dq,95);toast('Карточка отправлена в очередь ОМД');return}
 if(a==='run-dq'){toast('DQ выполнен: обязательность, форматы, справочники, дубли по зеркалу');return}
 if(a==='publish-1c'){toast('Событие в outbox; ожидается ack и обратный код Ц…');return}
 if(a==='choose-file'){state.imported=true;state.importProcessed=false;render(false);return}
 if(a==='process-import'){state.importProcessed=true;render(false);toast('Столбцы распределены по владельцам блоков');return}
 if(a==='accept-import'){toast('Пакет принят: создаются входящие карточки и задания');return}
 if(a==='run-migration'){toast('Фаза миграции запущена: карточки грузятся в зеркало со статусом «Мигрировано»');return}
 if(a==='open-create-supplier'){state.modal='createSupplier';render(false);return}
 if(a==='confirm-create-supplier'){const name=($('#csName')||{}).value||'Новый поставщик';const type=($('#csType')||{}).value||'Локальный';const id='sup'+(suppliers.length+1);suppliers.push({id,name,code:'—',type,status:'На верификации',email:'new@supplier.kg',login:name.replace(/[^a-zA-Zа-яА-Я]/g,'').slice(0,8).toLowerCase()||'supplier',via:'самостоятельно'});state.modal=null;toast('Поставщик создан в статусе «На верификации»');return}
 if(a==='approve-supplier'){const s=supBy(b.dataset.id);if(s){s.status='Одобрен';if(s.code==='—')s.code='Ц000'+(12100+suppliers.length)}toast('Поставщик одобрен; логин отправлен на почту');render();return}
 if(a==='select-dir'){state.selectedDir=b.dataset.dir;render(false);return}
 if(a==='add-nsi'){state.modal='nsi';render(false);return}
 if(a==='save-nsi'){directories[state.selectedDir].push(($('#nsiName')||{}).value||'Новое значение');state.modal=null;toast('Значение НСИ сохранено');return}
 if(a==='open-add-product'){state.modal='addProduct';render(false);return}
 if(a==='save-product-draft'){state.modal=null;toast('Черновик сохранён в вашем ассортименте (не отправлен)');return}
 if(a==='submit-product'){submitProduct();return}
 if(a==='close-modal'){state.modal=null;render(false);return}}
/* Связка ЛКП→MDM: отправка заявки создаёт входящую заявку и черновик SKU в MDM */
function submitProduct(){const sup=supBy(state.supplier);const nameRu=($('#apNameRu')||{}).value||'Новый товар (без названия)';const nameKg=($('#apNameKg')||{}).value||'';const brand=($('#apBrand')||{}).value||sup.name;const tm=($('#apTm')||{}).value||brand;const weight=($('#apWeight')||{}).value||'—';const tnved=($('#apTnved')||{}).value||'—';const country=($('#apCountry')||{}).value||(sup.type==='Зарубежный'?'—':'Кыргызстан');const barcode=($('#apBarcode')||{}).value||('20000000'+(50000+requests.length));
 const n=requests.length+1;const skuId='skuN'+n;const reqId='rN'+n;const number=nextNum();
 skus.unshift({id:skuId,name:nameRu,supplierId:sup.id,supplier:sup.name,source:number,barcode:barcode,code:'—',category:'Не определена',status:'Черновик из заявки',progress:8,dq:15,version:'Рабочая v1',published:false,route:['КО'],returns:[],history:[[today+' · сейчас','Система','Создан черновик из заявки ЛКП '+number]]});
 requests.unshift({id:reqId,number:number,type:'Новый SKU',source:'ЛКП',channel:sup.via.includes('импорт')?'Менеджер по импорту':'Поставщик',supplierId:sup.id,supplier:sup.name,name:nameRu,barcode:barcode,received:today+' · сейчас',status:'На первичной проверке ОМД',priority:'Обычный',owner:'Данияр Садыков',linkedSku:skuId,route:{КО:true,РЦ:true,Импорт:sup.type==='Зарубежный',УЦП:true},correction:null,primary:{'Наименование RU':nameRu,'Наименование KG':nameKg||'—','Бренд':brand,'Товарная марка':tm,'Штрихкод':barcode,'Вес нетто':weight,'Код ТНВЭД':tnved,'Страна происхождения':country,'Тип поставщика':sup.type},history:[[today+' · сейчас','ЛКП','Заявка отправлена поставщиком '+sup.name],[today+' · сейчас','MDM','Получен ack (идемпотентно), создан черновик SKU, зафиксирован supplier_id '+sup.code]]});
 state.modal=null;state.lkpScreen='requests';toast('Заявка '+number+' отправлена. Появилась во «Входящих заявках» MDM');render()}
render();
</script></body></html>
