let selectedKanbanSku=null,kanbanSearch={todo:'',review:'',done:''};
function mdm(){
 const role=state.role,skuList=state.skus;
 const bucket=s=>{
  if(role==='КО')return s.status==='На проверке КО'||s.status==='На доработке'||s.status==='Проверка дубля'?'todo':s.status==='На проверке ОМД'&&s.stage===1?'review':'done';
  if(role==='РЦ')return s.status==='НЕ ПОЛНАЯ'||s.status==='На доработке'&&s.stage===2?'todo':s.status==='На проверке ОМД'&&s.stage===2?'review':'done';
  return s.status==='На проверке ОМД'?'todo':s.status==='Проверка дубля'||s.status==='На доработке'?'review':'done';
 };
 const buckets={todo:[],review:[],done:[]};skuList.forEach(s=>buckets[bucket(s)].push(s));
 const current=skuList.find(s=>s.id===selectedKanbanSku)||buckets.todo[0]||buckets.review[0]||buckets.done[0];if(current)selectedKanbanSku=current.id;
 const columns=[['todo',role==='КО'?'КО':role==='РЦ'?'РЦ':'ОМД',''],['review','На проверке','review'],['done','Готовые','done']];

   let total=role==='КО'?3:role==='РЦ'?5:4;let done=key==='done'?total:key==='review'?Math.max(1,total-1):Math.max(0,Math.round(total*s.completeness/150));

 }).join('')||'<div class="kb-empty">Нет карточек</div>';

function kanbanDetail(s,role){
 const sections=role==='КО'?[['Поставщик',[['name','Наименование полное (русский язык)'],['barcode','Штрих код'],['tnved','Код ТНВЭД']]],['КО',[['type','Тип номенклатуры (шт / кг)'],['brand','Бренд'],['category','Категория товара'],['price','Начальная закупочная цена']]],['РЦ',[['net','Вес нетто, кг']]]]:role==='РЦ'?[['Поставщик',[['name','Наименование'],['barcode','Штрихкод']]],['РЦ',[['net','Вес нетто 1 ед. товара, кг'],['gross','Вес брутто, кг'],['width','Ширина БЕИ, м'],['height','Высота БЕИ, м'],['depth','Глубина БЕИ, м'],['qty','Количество БЕИ в ГУ3']]]]:[['Поставщик',[['name','Наименование'],['barcode','Штрихкод'],['tnved','Код ТНВЭД']]],['КО',[['type','Тип номенклатуры'],['brand','Бренд'],['price','Начальная цена']]],['РЦ',[['net','Вес нетто'],['gross','Вес брутто'],['qty','Количество в упаковке']]]];
 let decisions=s.kbDecisions||{},accepted=Object.values(decisions).filter(v=>v==='accepted').length,returned=Object.values(decisions).filter(v=>v==='returned').length;
 let attrs=sections.map(([name,fields])=>'<div class="kb-section"><div class="kb-section-heading"><span><span class="pill">'+(name==='Поставщик'?'◈':name==='КО'?'⬡':'⬢')+'</span> '+name+'</span><small class="muted">'+fields.filter(([k])=>decisions[k]==='accepted').length+'/'+fields.length+'</small></div>'+fields.map(([key,label])=>{

 }).join('')+'</div>').join('');
 return '<small class="muted">'+esc(s.code)+'</small><h3>'+esc(s.name)+'</h3><div class="progress" style="margin:10px 0"><span style="width:'+s.completeness+'%;background:#f43f5e"></span></div><div class="row-flex" style="justify-content:space-between"><small class="muted">Прогресс '+s.completeness+'%</small>'+badge(s.status)+'</div><div class="kb-section"><div class="kb-section-heading">Исполнитель</div><select class="select" style="width:100%" data-kb-assignee="'+s.id+'"><option>Не назначен</option>'+['Анна','Бакыт','Сотрудник КО','Сотрудник РЦ','Специалист ОМД'].map(v=>'<option '+(s.assignee===v?'selected':'')+'>'+v+'</option>').join('')+'</select></div>'+attrs+'<div class="kb-side-actions">'+(role==='КО'?btn('✓ Передать ОМД','kanban-ko-'+s.id,'green'):role==='РЦ'?btn('✓ Передать ОМД','kanban-rc-'+s.id,'green'):btn('✓ Согласовать этап','kanban-omd-'+s.id,'green'))+btn('↩ На доработку','kanban-return-'+s.id)+btn('Карточка целиком','sku-'+s.id,'small')+'</div><small class="muted">Принято атрибутов: '+accepted+' · Возвращено: '+returned+'</small>';
}

function duplicates(){let groups=[];state.skus.forEach((s,i)=>state.skus.slice(i+1).forEach(other=>{if(s.barcode&&s.barcode===other.barcode||s.name.toLowerCase()===other.name.toLowerCase())groups.push([s,other])}));return header('Список дубликатов','Проверка ШК/GTIN → ПЛУ → наименование + бренд + упаковка',btn('Запустить проверку','check-dupes','primary'))+section('Потенциальные совпадения',groups.length?table(['Карточка A','Карточка B','Ключ','Действие'],groups.map(([a,b])=>`<tr><td>${a.code} — ${esc(a.name)}</td><td>${b.code} — ${esc(b.name)}</td><td>ШК / наименование</td><td>${btn('Разобрать','resolve-'+b.id,'small')}</td></tr>`)):note('Совпадения не обнаружены. Создайте товар с повторным штрихкодом, чтобы проверить блокировку.','success'))}
function quality(){let avg=Math.round(state.skus.reduce((a,s)=>a+s.completeness,0)/Math.max(1,state.skus.length));return header('Качество мастер-данных','Полнота, статусы, контроль качества и публикация')+`<div class="stats">${[['Средняя полнота',avg+'%'],['Полные',state.skus.filter(s=>s.status==='ПОЛНАЯ').length],['Неполные',state.skus.filter(s=>s.status==='НЕ ПОЛНАЯ').length],['Всего',state.skus.length]].map(([k,v])=>`<div class="stat"><small>${k}</small><div class="num">${v}</div></div>`).join('')}</div>`+section('Полнота по карточкам',state.skus.map(s=>`<div style="display:grid;grid-template-columns:minmax(160px,1fr) 2fr 50px;align-items:center;gap:13px;margin-bottom:15px"><button class="link" style="text-align:left" data-sku="${s.id}">${esc(s.name)}</button><div class="progress"><span style="width:${s.completeness}%"></span></div><strong>${s.completeness}%</strong></div>`).join(''))+note('Показатели рассчитываются по локальным демонстрационным данным. Метрики интеграций и SLA не подключены.');}

function download(filename,rows){let csv=rows.map(row=>row.map(c=>'"'+String(c??'').replaceAll('"','""')+'"').join(';')).join('\r\n');let url=URL.createObjectURL(new Blob(['\ufeff',csv],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}const readModalFields=()=>Object.fromEntries([...document.querySelectorAll('.modal [data-field]')].map(e=>[e.dataset.field,e.value]));function validate(p){let errs=[];for(let [key,label,type] of PRODUCT_FIELDS){if(type==='auto')continue;if(!String(p[key]??'').trim()&&!(key==='barcode'&&p.type==='весовой'))errs.push(label)}if(p.type==='штучный'&&!/^\d{8,13}$/.test(p.barcode||''))errs.push('Штрихкод: 8–13 цифр');if(p.type==='весовой'&&p.barcode)errs.push('Весовой товар: штрихкод должен быть пустым');if(!/^\d{10}$/.test(p.tnved||''))errs.push('ТНВЭД: ровно 10 цифр');if(Number(p.gross)<Number(p.net))errs.push('Брутто не может быть меньше нетто');for(let k of ['net','gross','width','height','depth','packGross','packWidth','packHeight','packDepth','qty','basePrice','fullPrice'])if(!(Number(p[k])>0))errs.push(k+': значение > 0');if(!Number.isInteger(Number(p.qty)))errs.push('Количество в упаковке — целое');return [...new Set(errs)]}
function action(a){if(a==='logout'){state.login=false;save();render();return}if(a==='reset'){if(confirm('Сбросить все изменения и восстановить демонстрационные данные?')){state=initial();save();nav('dashboard')}return}if(a==='close'){modal=null;render();return}if(a==='new-nom'||a==='new-correction'){if(a==='new-correction'&&!editing){let code=prompt('Введите Ц-код товара из вашего ассортимента:',state.skus[0]?.code||'');if(!code)return;let found=state.skus.find(s=>s.code===code.trim());if(!found){toast('Ц-код не найден в ассортименте');return}editing=found.id}let type=a==='new-nom'?'Номенклатура':'Корректировка';let d={id:uid(state.docs),type,date:today(),category:categories[0],note:'',status:'Черновик',products:[]};state.docs.unshift(d);record('Создан документ '+d.type+' №'+d.id);modal={kind:'doc',id:d.id};render();return}if(a==='add-product'){let d=state.docs.find(x=>x.id===modal.id);modal={kind:'product',title:'Добавить товар',docId:d.id,correction:d.type==='Корректировка'};render();return}if(a.startsWith('edit-product-')){let d=state.docs.find(x=>x.id===modal.id),i=Number(a.split('-').pop());modal={kind:'product',title:'Редактирование товара',docId:d.id,index:i,product:d.products[i],correction:d.type==='Корректировка'};render();return}if(a==='save-product'){let p=readModalFields(),d=state.docs.find(x=>x.id===modal.docId);p.volume=(+p.width*+p.height*+p.depth||0).toFixed(6);p.packVolume=(+p.packWidth*+p.packHeight*+p.packDepth||0).toFixed(6);if(modal.correction){let old=state.skus.find(x=>x.id===editing);p.name=p.name||old?.name;p.code=old?.code;p.delta=Object.keys(p).filter(k=>p[k]&&String(p[k])!==String(old?.[k]||''))}if(modal.index===undefined)d.products.push(p);else d.products[modal.index]=p;modal={kind:'doc',id:d.id};save();toast('Строка сохранена');render();return}if(a==='save-doc'||a==='send-doc'){let d=state.docs.find(x=>x.id===modal.id),f=readModalFields();d.note=f.note;d.category=f.category;if(!d.products.length){toast('Добавьте хотя бы одну строку');return}if(a==='send-doc'){let errors=[];d.products.forEach((p,i)=>{let e=d.type==='Номенклатура'?validate(p):(!p.delta?.length?['Нет изменённых атрибутов']:[]);if(e.length)errors.push(`Строка ${i+1}: ${e.slice(0,4).join(', ')}${e.length>4?'…':''}`)});if(errors.length){alert('Исправьте ошибки перед отправкой:\n'+errors.join('\n'));return}d.status='В MDM';d.products.forEach(p=>{if(d.type==='Номенклатура'){let duplicate=state.skus.some(s=>s.barcode&&s.barcode===p.barcode);let id=uid(state.skus);state.skus.push({id,code:'ОЖИДАЕТ-'+id,name:p.name,type:p.type,barcode:p.barcode,brand:p.brand,category:d.category,status:duplicate?'Проверка дубля':'На проверке КО',stage:1,completeness:60,price:Number(p.fullPrice),fields:p})}else{let sku=state.skus.find(s=>s.code===p.code);if(sku){sku.status='На проверке КО';sku.completeness=Math.max(70,sku.completeness);sku.pending=p.delta}}});record('Документ №'+d.id+' передан в MDM (демо ACK)')}else{record('Сохранён документ №'+d.id)}modal=null;render();return}if(a==='save-price'||a==='submit-price'||a==='manager-approve'||a==='director-approve'||a==='director-return'||a==='assistant-approve'){let p=state.prices.find(x=>x.id===modal.id);document.querySelectorAll('[data-price-index]').forEach(el=>p.items[Number(el.dataset.priceIndex)].next=Number(el.value));if(a==='submit-price'){p.status='У менеджеров';record('Переоценка №'+p.id+' направлена менеджерам')}if(a==='manager-approve'){let m=document.querySelector('#manager')?.value||state.manager||'Анна';state.manager=m;if(!p.items.some(it=>it.manager===m)){toast('В документе нет ваших товаров');return}if(!p.approved.includes(m))p.approved.push(m);if(['Анна','Бакыт'].every(x=>p.approved.includes(x)))p.status='У директора';record('Менеджер '+m+' согласовал свою часть №'+p.id)}if(a==='director-approve'){p.status='Одобрен';record('Коммерческий директор одобрил №'+p.id)}if(a==='director-return'){p.status='На доработке';p.approved=[];record('Переоценка №'+p.id+' возвращена менеджерам')}if(a==='assistan e-')||a.startsWith('return-')){let id=Number(a.split('-').pop()),s=state.skus.find(x=>x.id===id);if(a.startsWith('ko-')){s.status='На проверке ОМД';s.completeness=85;record('КО подтвердил данные '+s.name)}else if(a.startsWith('rc-')){s.status='На проверке ОМД';s.stage=2;s.completeness=100;record('РЦ внёс ВГХ '+s.name)}else if(a.startsWith('approve-')){if(s.stage===1){s.status='НЕ ПОЛНАЯ';s.stage=2;s.code=s.code.startsWith('ОЖИДАЕТ')?'Ц'+String(10000000+s.id).slice(1):s.code;s.completeness=85;record('ОМД: этап 1 согласован; Ц-код возвращён из 1С (демо)')}else{s.status='ПОЛНАЯ';s.completeness=100;record('ОМД: Golden Record '+s.code+' опубликован в 1С (демо)')}}else{let reason=prompt('Укажите причину точечного возврата:','Уточните значения атрибутов');if(!reason)return;s.status='На доработке';record('Возврат '+s.code+': '+reason)}modal=null;render();return}if(a.startsWith('correct-')){editing=Number(a.split('-').pop());action('new-correction');return}if(a.startsWith('new-mdm')){state.role='Поставщик';nav('nomenclature');action('new-nom');return}if(a.startsWith('template-')){let type=a.slice(9);let cols=type==='price'?['Ц-код','Старая цена','Новая цена']:type==='Корректировка'?['Ц-код',...PRODUCT_FIELDS.slice(0,25).map(x=>x[1])]:PRODUCT_FIELDS.map(x=>x[1]);download('UMAI_шаблон_'+type+'.csv',[cols]);return}if(a.startsWith('export-')){let kind=a.slice(7);if(kind==='skus')download('UMAI_ассортимент.csv',[['Ц-код','Наименование','Штрихкод','Тип','Статус','Полнота'],...state.skus.map(s=>[s.code,s.name,s.barcode,s.type,s.status,s.completeness])]);else if(kind==='history')download('UMAI_аудит.csv',[['Дата','Роль','Действие'],...state.history.map(h=>[h.at,h.role,h.text])]);else if(kind.startsWith('price-')){let p=state.prices.find(x=>x.id===+kind.slice(6));download('Переоценка_'+p.id+'.csv',[['Ц-код','Товар','Менеджер','Старая цена','Новая цена'],...p.items.map(it=>[state.skus.find(s=>s.id===it.sku)?.code,state.skus.find(s=>s.id===it.sku)?.name,it.manager,it.old,it.next])])}el  let id=Number(op.split('-').pop()),s=state.skus.find(x=>x.id===id);if(!s)return;

 if(op.startsWith('kanban-ko-')){s.status='На проверке ОМД';s.stage=1;s.completeness=Math.max(85,s.completeness);record('КО передал '+s.code+' на визу ОМД')}
 if(op.startsWith('kanban-rc-')){s.status='На проверке ОМД';s.stage=2;s.completeness=100;record('РЦ завершил ВГХ и передал '+s.code+' в ОМД')}

 render();

д отправкой.')})}});let debounce;document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;clearTimeout(debounce);let focus=e.target.selectionStart;debounce=setTimeout(()=>{render();let input=document.getElementById('search');if(input){input.focus();input.setSelectionRange(focus,focus)}},180)}if(e.target.dataset.field&&['width','height','depth','packWidth','packHeight','packDepth'].includes(e.target.dataset.field)){let f=readModalFields();let v=(+f.width*+f.height*+f.depth||0).toFixed(6),pv=(+f.packWidth*+f.packHeight*+f.packDepth||0).toFixed(6);let vol=document.querySelector('[data-field="volume"]'),pack=document.querySelector('[data-field="packVolume"]');if(vol)vol.value=v;if(pack)pack.value=pv}});document.addEventListener('submit',e=>{if(e.target.id==='login-form'){e.preventDefault();state.login=true;save();render();toast('Добро пожаловать в демонстрационную среду')}});render();})();
