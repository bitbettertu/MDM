function loginView(){return `<section class="login"><div class="login-visual"><div class="login-brand"><div class="brand-logo">U</div><div><b>UMAI GROUP</b><span>Внутренний контур данных</span></div></div><div class="login-copy"><div class="eyebrow">MDM 2.0 · Внутренняя фабрика качества</div><h1>Заявка из ЛКП превращается в Golden Record</h1><p>ОМД принимает первичные данные, проверяет заявку, распределяет задания между отделами, контролирует корректировки и публикует согласованный эталон в 1С.</p><div class="login-pills"><span>Входящие заявки</span><span>Параллельные задания</span><span>Корректировки и версии</span><span>Quality gate</span></div></div><small style="color:#7f8690;z-index:1">Интерфейс ЛКП не входит в макет. В MDM показан только входящий поток данных из ЛКП.</small></div><div class="login-panel"><div class="login-box"><h2>Вход сотрудника</h2><p>Корпоративная учётная запись UMAI GROUP.</p><div class="field"><label>Логин</label><input value="data.steward"></div><div class="field"><label>Пароль</label><input type="password" value="123456"></div><button class="btn primary" data-action="login">Войти в MDM</button><p class="login-note">Демо: после входа можно переключать роли ОМД, КО, РЦ, Импорт и УЦП.</p></div></div></section>`}
const navGroups=[['Рабочий поток',[['dashboard','dashboard','Обзор'],['requests','inbox','Входящие заявки'],['tasks','tasks','Задания отделов'],['skus','box','Карточки SKU'],['corrections','edit','Корректировки']]],['Качество',[['dq','shield','DQ и дубли'],['approval','check','Согласование ОМД'],['golden','gold','Golden Record']]],['Обмен и данные',[['journal','sync','Журнал 1С'],['import','upload','Excel-импорт'],['nsi','settings','НСИ и атрибуты'],['reports','report','Отчёты']]]];
function screenTitle(){return ({dashboard:'Обзор MDM',requests:'Входящие заявки из ЛКП',request:'Карточка заявки',tasks:'Задания отделов',skus:'Карточки SKU',sku:'Рабочая карточка SKU',corrections:'Корректировки и версии',dq:'DQ и дубли',approval:'Согласование ОМД',golden:'Golden Record',journal:'Обмен с 1С',import:'Excel-импорт',nsi:'НСИ и атрибуты',reports:'Отчёты'}[state.screen]||'MDM 2.0')}
function shell(content){const reqBadge=requests.filter(r=>!/Маршрутизировано|В работе/.test(r.status)).length;return `<div class="app ${state.menu?'menu-open':''}"><aside class="sidebar"><div class="brand"><div class="brand-logo">U</div><div class="brand-copy"><strong>MDM 2.0</strong><span>UMAI GROUP</span></div></div><div class="side-scroll">${navGroups.map(g=>`<div class="nav-label">${g[0]}</div>${g[1].map(n=>`<button class="nav-btn ${state.screen===n[0]?'active':''}" data-action="nav" data-screen="${n[0]}">${icon(n[1])}<span>${n[2]}</span>${n[0]==='requests'?`<em class="badge">${reqBadge}</em>`:n[0]==='tasks'?`<em class="badge">${tasks.filter(t=>!t.status.includes('Заверш')).length}</em>`:''}</button>`).join('')}`).join('')}</div><div class="side-footer"><div class="user-card"><div class="avatar">ДС</div><div class="user-meta"><b>Данияр Садыков</b><span>${state.role}</span></div><button class="logout" data-action="logout">${icon('logout')}</button></div></div></aside><section class="workspace"><header class="topbar"><button class="menu-btn" data-action="menu">${icon('menu')}</button><div class="breadcrumb"><strong>${screenTitle()}</strong><span>Внутренний MDM · ${today}</span></div><label class="search-global">${icon('search')}<input placeholder="Заявка, код, GTIN, товар…" data-global-search value="${esc(state.search)}"></label><div class="sync-pill"><i class="sync-dot"></i>1С доступна</div><select class="role-select" data-role>${roles.map(r=>`<option ${state.role===r?'selected':''}>${r}</option>`).join('')}</select><button class="btn icon">${icon('bell')}</button></header><main class="page-scroll"><div class="page">${content}<div class="scroll-proof">Конец рабочей области · скролл выполнен внутри приложения</div></div></main></section>${state.modal?modalView():''}${state.toast?`<div class="toast">${state.toast}</div>`:''}</div>`}
function workflow(current=1){const steps=[['ЛКП','Первичные данные'],['ОМД','Проверка заявки'],['Отделы','Параллельные блоки'],['DQ','Качество и дубли'],['ОМД','Согласование'],['GR','Golden Record'],['1С','Публикация']];return `<div class="workflow-strip">${steps.map((s,i)=>`<div class="workflow-step ${i<current?'done':i===current?'active':''}"><div class="workflow-node"><b>${i+1}. ${s[0]}</b><span>${s[1]}</span></div></div>`).join('')}</div>`}
function dashboardView(){const newReq=requests.filter(r=>!/Маршрутизировано/.test(r.status)).length;return `<div class="hero"><div><div class="eyebrow">Сквозной процесс MDM 2.0</div><h1>От заявки из ЛКП до кода 1С</h1><p>Первичные данные не превращаются в карточку автоматически. Сначала ОМД принимает заявку, проверяет дубли и маршрут, затем распределяет задания владельцам атрибутов.</p></div><div class="hero-note"><b>Главный фокус итерации</b><span>Входящие заявки, распределение задач, корректировки опубликованных и рабочих карточек.</span><div class="mini-line"><i style="width:86%"></i></div><span style="margin-top:7px">Справочники полей загружены из Excel отделов</span></div></div>${workflow(1)}<div class="kpis"><div class="card kpi"><div class="kpi-top"><div class="kpi-icon">${icon('inbox')}</div><span class="trend">+4 сегодня</span></div><b>${newReq}</b><span>Заявки ждут решения ОМД</span></div><div class="card kpi"><div class="kpi-top"><div class="kpi-icon">${icon('tasks')}</div></div><b>${tasks.filter(t=>!t.status.includes('Заверш')).length}</b><span>Активные задания отделов</span></div><div class="card kpi"><div class="kpi-top"><div class="kpi-icon">${icon('edit')}</div></div><b>3</b><span>Корректировки в работе</span></div><div class="card kpi"><div class="kpi-top"><div class="kpi-icon">${icon('gold')}</div></div><b>31</b><span>Готово к публикации</span></div></div><div class="grid-2"><section class="card panel"><div class="panel-head"><div><h2>Новые входящие заявки</h2><p>ОМД должен принять решение до создания заданий</p></div><button class="text-link" data-action="nav" data-screen="requests">Все заявки →</button></div><div class="table-wrap"><table class="data-table request-table"><thead><tr><th>Заявка / товар</th><th>Тип</th><th>Получено</th><th>Статус</th><th></th></tr></thead><tbody>${requests.slice(0,4).map(r=>`<tr><td><button class="link-row" data-action="open-request" data-id="${r.id}"><span class="row-title">${r.name}</span><span class="sub">${r.number} · ${r.supplier}</span></button></td><td><span class="status ${r.type.includes('Коррект')?'amber':'blue'}">${r.type}</span></td><td>${r.received}</td><td><span class="status ${statusClass(r.status)}">${r.status}</span></td><td><button class="btn small" data-action="open-request" data-id="${r.id}">Разобрать ${icon('chev')}</button></td></tr>`).join('')}</tbody></table></div></section><section class="card panel"><div class="panel-head"><div><h2>Владельцы полей</h2><p>Количество столбцов из загруженного Excel</p></div></div><div class="metric-list">${[['КО',koMdmFields.length,'master-data'],['РЦ',RC_FIELDS.length,'ВГХ и ГУ'],['Импорт',IMPORT_FIELDS.length,'тара / утильсбор'],['УЦП',UCP_FIELDS.length,'пока из ТЗ']].map(x=>`<div class="metric-row"><div><b>${x[0]}</b><span>${x[2]}</span></div><span class="metric-num">${x[1]}</span></div>`).join('')}</div><div class="scope-note" style="margin-top:12px">Ценовые и операционные столбцы из листа КО отмечены как «контур 1С» и не входят в Golden Record.</div></section></div>`}
function requestsView(){const rows=state.requestFilter==='Все'?requests:requests.filter(r=>r.type===state.requestFilter);return `${head('Входящие заявки','Здесь начинается внутренний процесс MDM. Интерфейс ЛКП не показан — только полученные от него данные и события.',`<button class="btn">${icon('download')}Экспорт</button>`)}<div class="source-banner"><div class="source-badge">ЛКП</div><div><b>Входящий интеграционный контур</b><span>Каждая заявка получает номер, фиксированный источник и ACK. Данные не перезаписывают существующий Golden Record без решения ОМД.</span></div></div><div class="filters"><input class="filter-input" placeholder="Номер, поставщик, товар" data-request-search><select class="filter-select" data-request-filter><option>Все</option><option>Новый SKU</option><option>Корректировка SKU</option></select><select class="filter-select"><option>Все статусы</option><option>На первичной проверке ОМД</option><option>Готово к маршрутизации</option><option>Ожидает решения ОМД</option></select><span class="filter-spacer"></span><span class="status red">${rows.length} заявок</span></div><div class="card table-wrap"><table class="data-table request-table"><thead><tr><th>Источник / заявка</th><th>Поставщик и товар</th><th>Тип</th><th>Ответственный ОМД</th><th>Приоритет</th><th>Статус</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td><div class="source-cell"><span class="source-mini">ЛКП</span><div><b>${r.number}</b><span class="sub">${r.received}</span></div></div></td><td><button class="link-row" data-action="open-request" data-id="${r.id}"><span class="row-title">${r.name}</span><span class="sub">${r.supplier} · GTIN ${r.barcode}</span></button></td><td><span class="status ${r.type.includes('Коррект')?'amber':'blue'}">${r.type}</span></td><td>${r.owner}</td><td><span class="status ${r.priority==='Критический'?'red':r.priority==='Высокий'?'amber':'gray'}">${r.priority}</span></td><td><span class="status ${statusClass(r.status)}">${r.status}</span></td><td><button class="btn small primary" data-action="open-request" data-id="${r.id}">Открыть</button></td></tr>`).join('')}</tbody></table></div>`}
function primaryItems(obj){return `<div class="primary-grid">${Object.entries(obj).map(([k,v])=>`<div class="primary-item"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}</div>`}
function routeCard(r,dept,count,desc){const active=r.route[dept];const key=dept==='УЦП'?'УЦП':dept;const opts=employees[key]||employees.ОМД;return `<div class="route-card ${active?'':'disabled'}"><div class="route-head"><input type="checkbox" data-action="toggle-route" data-dept="${dept}" ${active?'checked':''}><div><b>${dept}</b><span>${desc}</span></div><span class="scope-badge ${active?'green':''}">${count} полей</span></div><div class="route-body"><label>Исполнитель</label><select ${active?'':'disabled'}>${opts.map(x=>`<option>${x}</option>`).join('')}</select><div class="route-meta"><span class="scope-badge">Параллельно</span><span class="scope-badge ${active?'blue':''}">${active?'Активный блок':'Не требуется'}</span></div></div></div>`}
function requestView(){const r=reqBy(state.activeRequest)||requests[0];const stage=/Маршрутизировано/.test(r.status)?2:/Готово к маршрутизации/.test(r.status)?1:/Корректировка|решения/.test(r.status)?1:1;return `<div class="request-layout"><div class="request-main"><section class="card request-card"><div class="request-title"><div><div class="request-kicker">${r.number} · источник ${r.source}</div><h1>${r.name}</h1><p>${r.supplier} · получено ${r.received} · ответственный ${r.owner}</p></div><span class="status ${statusClass(r.status)}">${r.status}</span></div><div class="chip-row" style="margin-top:13px"><span class="info-chip source">Источник: ЛКП</span><span class="info-chip">${r.type}</span><span class="info-chip">GTIN ${r.barcode}</span><span class="info-chip">${r.priority} приоритет</span></div></section><section class="card panel"><div class="panel-head"><div><h2>Сквозной маршрут заявки</h2><p>Карточка и задания создаются только после решения ОМД</p></div></div>${workflow(stage)}</section><section class="card panel"><div class="panel-head"><div><h2>Первичные данные из ЛКП</h2><p>Источник и исходные значения фиксируются в аудите. Отделы видят их как базу для заполнения.</p></div><span class="scope-badge red">read-only source</span></div>${primaryItems(r.primary)}</section>${r.correction?correctionDiff(r):''}<section class="card panel"><div class="panel-head"><div><h2>Распределение заданий ОМД</h2><p>ОМД определяет активные блоки по типу номенклатуры и назначает исполнителей.</p></div><div class="assignment-summary"><i></i><b>${Object.values(r.route).filter(Boolean).length} активных блока</b></div></div><div class="route-grid">${routeCard(r,'КО',koMdmFields.length,'Наименования, бренд, категория, коммерческие master-data')}${routeCard(r,'РЦ',RC_FIELDS.length,'БЕИ, ВГХ, сканер и упаковки ГУ1–ГУ4')}${routeCard(r,'Импорт',IMPORT_FIELDS.length,'Происхождение, тара, ТНВЭД и утильсбор')}${routeCard(r,'УЦП',UCP_FIELDS.length,'Хранение, состав, маркировка и двуязычие')}</div></section><section class="card panel"><div class="panel-head"><div><h2>История заявки</h2><p>Каждый переход и решение фиксируются отдельно</p></div></div>${timeline(r.history)}</section><div class="action-bar"><button class="btn" data-action="nav" data-screen="requests">Назад</button><button class="btn danger" data-action="reject-request">Отклонить</button><button class="btn" data-action="accept-request">Принять и создать черновик</button><button class="btn primary" data-action="start-route">Запустить задания отделам</button></div></div><aside class="request-side"><section class="card side-stat"><h3>Контроль ОМД</h3><div class="side-stat-row"><span>Тип заявки</span><b>${r.type}</b></div><div class="side-stat-row"><span>Дубликат по GTIN</span><b>${r.id==='r2'?'Связано с '+r.primary['Код 1С']:'Не найден'}</b></div><div class="side-stat-row"><span>Черновик SKU</span><b>${r.linkedSku?skuBy(r.linkedSku).version:'Не создан'}</b></div><div class="side-stat-row"><span>Активные отделы</span><b>${Object.keys(r.route).filter(k=>r.route[k]).join(', ')}</b></div></section><section class="card side-stat"><h3>Что делает система</h3><div class="timeline">${[['ACK','Заявка принята интеграцией'],['DQ 0','Проверка формата и GTIN'],['Route','ОМД выбирает владельцев полей'],['Tasks','Создаются независимые задания']].map((x,i)=>`<div class="timeline-item ${i<1?'done':i===1?'active':''}"><div class="timeline-dot">${i+1}</div><div class="timeline-copy"><b>${x[0]}</b><span>${x[1]}</span></div></div>`).join('')}</div></section><section class="card side-stat sticky-actions"><button class="btn" data-action="open-sku" data-id="${r.linkedSku}">Открыть черновик SKU</button><button class="btn primary" data-action="start-route">Назначить задания</button></section></aside></div>`}
function timeline(items){return `<div class="timeline">${items.map((x,i)=>`<div class="timeline-item ${i<items.length-1?'done':'active'}"><div class="timeline-dot">${i+1}</div><div class="timeline-copy"><b>${esc(x[1])}</b><span>${esc(x[0])} · ${esc(x[2])}</span></div></div>`).join('')}</div>`}
function correctionDiff(r){return `<section class="card panel"><div class="correction-banner"><div class="kpi-icon">${icon('edit')}</div><div><b>Это заявка на корректировку опубликованного SKU</b><span>Действующий Golden Record остаётся неизменным. ОМД сравнивает значения и создаёт задания только владельцам изменённых полей.</span></div></div><div class="table-wrap" style="margin-top:13px"><table class="diff-table"><thead><tr><th>Поле</th><th>Действующий GR</th><th>Новое из ЛКП</th><th>Владелец</th><th>Решение</th></tr></thead><tbody>${r.correction.map((x,i)=>`<tr class="diff-row"><td><b>${esc(x[0])}</b></td><td class="diff-old">${esc(x[1])}</td><td class="diff-new">${esc(x[2])}</td><td class="diff-owner">${x[3]}</td><td><select><option>Направить в ${x[3]}</option><option>Принять без задания</option><option>Отклонить изменение</option></select></td></tr>`).join('')}</tbody></table></div></section>`}
function tasksView(){let rows=tasks;if(state.taskFilter!=='Все')rows=rows.filter(t=>t.assignee===state.taskFilter);if(!state.role.includes('ОМД')&&!state.role.includes('Администратор')){const role=state.role.startsWith('УЦП')?'УЦП':state.role;rows=rows.filter(t=>t.assignee===role)}return `${head('Задания отделов','ОМД создаёт задания из заявки. Каждый отдел видит свои столбцы и работает параллельно.',`<button class="btn">${icon('download')}Экспорт XLS</button>`)}<div class="filters"><input class="filter-input" placeholder="Товар, заявка, блок"><select class="filter-select" data-task-filter><option>Все</option>${['КО','РЦ','Импорт','УЦП','ОМД'].map(x=>`<option ${state.taskFilter===x?'selected':''}>${x}</option>`).join('')}</select><select class="filter-select"><option>Все статусы</option><option>Новая</option><option>В работе</option><option>На доработке</option><option>Завершена</option></select><span class="filter-spacer"></span><span class="status blue">Роль: ${state.role}</span></div><div class="card table-wrap"><table class="data-table"><thead><tr><th>Заявка / SKU</th><th>Блок задания</th><th>Исполнитель</th><th>Полей</th><th>Дедлайн</th><th>Статус</th><th></th></tr></thead><tbody>${rows.map(t=>{const s=skuBy(t.sku),r=reqBy(t.request);return `<tr><td><button class="link-row" data-action="open-request" data-id="${r.id}"><span class="row-title">${s.name}</span><span class="sub">${r.number} · источник ЛКП</span></button></td><td><b>${t.block}</b><span class="sub">Владелец: ${t.assignee}</span></td><td>${t.person}</td><td><span class="scope-badge">${t.fields}</span></td><td style="font-weight:750;color:${t.deadline.includes('Просроч')?'var(--red)':'inherit'}">${t.deadline}</td><td><span class="status ${statusClass(t.status)}">${t.status}</span></td><td><button class="btn small primary" data-action="open-sku" data-id="${s.id}">Заполнить</button></td></tr>`}).join('')}</tbody></table></div><section class="card panel" style="margin-top:16px"><div class="panel-head"><div><h2>Логика доступа</h2><p>Поля других отделов доступны только для просмотра</p></div></div><div class="grid-2 equal"><div class="rule ok"><div class="rule-icon">✓</div><div><b>Свой блок</b><span>Редактирование, сохранение черновика и отправка на проверку.</span></div></div><div class="rule"><div class="rule-icon">🔒</div><div><b>Чужой блок</b><span>Значения видны для контекста, но поля заблокированы.</span></div></div></div></section>`}
function skuCard(s){return `<article class="card sku-card"><div class="sku-card-top"><span class="status ${statusClass(s.status)}">${s.status}</span><span class="scope-badge">${s.version}</span></div><h3>${s.name}</h3><p>${s.supplier}</p><div class="sku-meta"><span>GTIN <b>${s.barcode}</b></span><span>Код 1С <b>${s.code}</b></span><span>Источник <b>${s.source}</b></span></div><div class="progress ${s.progress===100?'green':''}"><i style="width:${s.progress}%"></i></div><div class="sku-card-foot"><span>${s.progress}% · DQ ${s.dq}</span><button class="btn small primary" data-action="open-sku" data-id="${s.id}">Открыть</button></div></article>`}
function skusView(){return `${head('Карточки SKU','Черновики создаются из принятых заявок; опубликованные карточки меняются только через отдельный запрос и новую версию.',`<button class="btn" data-action="nav" data-screen="import">${icon('upload')}Excel-импорт</button>`)}<div class="filters"><input class="filter-input" placeholder="Код, GTIN, наименование" data-sku-search value="${esc(state.search)}"><select class="filter-select"><option>Все версии</option><option>Рабочие</option><option>Golden Record</option></select><select class="filter-select"><option>Все статусы</option><option>Черновик из заявки</option><option>Заполнение отделами</option><option>Опубликовано</option></select><span class="filter-spacer"></span><span class="scope-badge red">Ручное создание SKU отключено</span></div><div class="sku-grid">${skus.filter(s=>!state.search||(`${s.name} ${s.barcode} ${s.code}`).toLowerCase().includes(state.search.toLowerCase())).map(s=>skuCard(s)).join('')}</div><div class="scope-note" style="margin-top:16px">Новая карточка появляется через принятую заявку ЛКП или валидированный Excel-импорт. Для опубликованного SKU создаётся запрос изменения, а не прямое редактирование Golden Record.</div>`}
const tabs=[['overview','Обзор'],['source','Первичные данные'],['ko','КО'],['rc','РЦ'],['import','Импорт'],['ucp','УЦП / Контент'],['correction','Корректировки'],['history','История версий']];
function skuView(){const s=skuBy(state.activeSku)||skus[0];return `<div class="sku-shell"><section class="card sku-summary"><div class="sku-summary-top"><div><span class="status ${statusClass(s.status)}">${s.status}</span><h1>${s.name}</h1><p>${s.supplier} · Источник: ${s.source}</p><div class="summary-tags"><span class="meta-chip">GTIN: <b>${s.barcode}</b></span><span class="meta-chip">Код 1С: <b>${s.code}</b></span><span class="meta-chip">Версия: <b>${s.version}</b></span><span class="meta-chip">Маршрут: <b>${s.route.join(' + ')}</b></span></div></div><div class="sku-action-row"><button class="btn" data-action="nav" data-screen="skus">Назад</button>${s.published?`<button class="btn primary" data-action="open-change">${icon('edit')}Создать запрос на изменение</button>`:`<button class="btn" data-action="open-return">Вернуть поле</button><button class="btn primary" data-action="approve-sku">Отправить ОМД</button>`}</div></div><div class="completion"><div><div class="progress ${s.progress===100?'green':''}"><i style="width:${s.progress}%"></i></div><span>Полнота активных блоков · DQ ${s.dq}/100</span></div><b>${s.progress}%</b></div></section><nav class="tabs">${tabs.map(t=>`<button class="tab ${state.skuTab===t[0]?'active':''}" data-action="sku-tab" data-tab="${t[0]}"><i class="dot ${s.returns.length&&t[0]==='correction'?'warn':''}"></i>${t[1]}</button>`).join('')}</nav>${skuTabView(s)}</div>`}
function skuTabView(s){if(state.skuTab==='overview')return overviewTab(s);if(state.skuTab==='source')return sourceTab(s);if(state.skuTab==='ko')return departmentFields(s,'КО',koMdmFields,KO_1C_ONLY);if(state.skuTab==='rc')return departmentFields(s,'РЦ',RC_FIELDS);if(state.skuTab==='import')return departmentFields(s,'Импорт',IMPORT_FIELDS);if(state.skuTab==='ucp')return departmentFields(s,'УЦП',UCP_FIELDS);if(state.skuTab==='correction')return correctionTab(s);return historyTab(s)}
function overviewTab(s){const r=requests.find(x=>x.linkedSku===s.id);return `<div class="grid-2"><section class="card panel"><div class="panel-head"><div><h2>Маршрут и задания</h2><p>Созданы ОМД из входящей заявки</p></div></div>${workflow(s.published?6:2)}<div class="mini-task-list" style="margin-top:13px">${tasks.filter(t=>t.sku===s.id).map(t=>`<div class="mini-task"><i class="dept-dot"></i><div><b>${t.block}</b><span>${t.person} · ${t.status}</span></div><span class="scope-badge">${t.fields} полей</span></div>`).join('')||'<div class="scope-note">Задания ещё не созданы. ОМД должен завершить маршрутизацию заявки.</div>'}</div></section><section class="card panel"><div class="panel-head"><div><h2>Контроль качества</h2><p>Quality gate до публикации</p></div></div><div class="rule-list"><div class="rule ${s.dq>90?'ok':'warn'}"><div class="rule-icon">${s.dq}</div><div><b>DQ score</b><span>Обязательность, форматы, единицы, справочники и бизнес-правила.</span></div></div><div class="rule ${s.returns.length?'warn':'ok'}"><div class="rule-icon">${s.returns.length}</div><div><b>Точечные возвраты</b><span>Открытые замечания по конкретным полям.</span></div></div><div class="rule ${s.published?'ok':''}"><div class="rule-icon">GR</div><div><b>Golden Record</b><span>${s.published?'Действующая версия защищена от прямого изменения.':'Формируется после согласования ОМД.'}</span></div></div></div></section></div>${r?`<section class="card panel" style="margin-top:16px"><div class="panel-head"><div><h2>Связанная заявка</h2><p>${r.number} · ${r.type}</p></div><button class="btn small" data-action="open-request" data-id="${r.id}">Открыть заявку</button></div>${primaryItems(Object.fromEntries(Object.entries(r.primary).slice(0,6)))}</section>`:''}`}
function sourceTab(s){const r=requests.find(x=>x.linkedSku===s.id);return `<section class="card panel"><div class="source-banner"><div class="source-badge">ЛКП</div><div><b>Неизменяемый снимок первичных данных</b><span>Это то, что было получено на момент подачи заявки. Последующие правки отделов и Golden Record хранятся отдельно.</span></div></div>${r?primaryItems(r.primary):'<div class="scope-note">Карточка создана Excel-импортом, связанной заявки ЛКП нет.</div>'}</section>`}
function ownerCanEdit(dept,s){if(s.published)return false;if(state.role.includes('Администратор'))return true;if(state.role.includes('ОМД'))return false;if(dept==='УЦП')return state.role.startsWith('УЦП');return state.role===dept}
function sampleValue(field,s,dept,i){const map={'Штрих код':s.barcode,'Штрихкод':s.barcode,'Наименование':s.name,'Номенклатура':s.name,'Поставщик':s.supplier,'Наименование полное (Русский язык)':s.name,'Страна происхождения':'Кыргызстан','Бренд ':'Ак-Сүт','Бренд номенклатуры':'Ак-Сүт','Срок хранения, сут.':'180','Базовая единица измерения БЕИ':'шт','Тип товара (штучный, весовой)':'штучный','Код ТНВЭД':'0401209109'};return map[field]??(i%7===0?'Заполнено':i%5===0?'1,000':'')}
function fieldRows(fields,s,dept,lockedAll=false){const can=ownerCanEdit(dept,s)&&!lockedAll;return `<div class="field-grid-catalog">${fields.map((f,i)=>{const ret=s.returns.find(x=>x.dept===dept&&x.field===f);const changed=s.published&&i<2;const cls=!can?'locked':ret?'returned':changed?'changed':'';return `<div class="field-row ${cls}"><label><span>${esc(f)}</span><span class="field-owner ${dept==='КО'?'ko':dept==='РЦ'?'rc':dept==='Импорт'?'import':'ucp'}">${dept}</span></label><input value="${esc(sampleValue(f,s,dept,i))}" ${can?'':'disabled'} placeholder="${can?'Введите значение':'Только просмотр'}">${ret?`<span class="sub" style="color:var(--red);margin-top:6px">Возврат ОМД: ${esc(ret.reason)}</span>`:''}</div>`}).join('')}</div>`}
function departmentFields(s,dept,fields,outside=[]){const can=ownerCanEdit(dept,s);return `<div class="dept-toolbar"><span class="scope-badge ${dept==='КО'?'blue':dept==='РЦ'?'green':dept==='Импорт'?'red':'amber'}">Владелец: ${dept}</span><span class="scope-badge">${fields.length} полей из Excel/ТЗ</span><span class="scope-badge ${can?'green':'red'}">${can?'Редактирование доступно':'Только просмотр'}</span><span class="spacer"></span>${!s.published?`<button class="btn" data-action="save-draft">Сохранить черновик</button><button class="btn primary" data-action="complete-block" ${can?'':'disabled'}>Завершить блок</button>`:''}</div><div class="scope-note">Названия полей сохранены по загруженному Excel. Другие отделы видят значения, но не могут менять чужой блок. ОМД возвращает конкретное поле с причиной.</div><div class="field-catalog"><section class="field-group"><div class="field-group-head"><div><h3>${dept} · мастер-данные</h3><p>${dept==='РЦ'?'БЕИ, ГУ1–ГУ4, хранение и данные сканера':dept==='Импорт'?'Первичная и вторичная тара, ТНВЭД и утильсбор':dept==='КО'?'Идентификация и коммерческие master-data':'Хранение, состав и контент'}</p></div><span class="scope-badge green">В MDM</span></div>${fieldRows(fields,s,dept)}</section>${outside.length?`<section class="field-group"><div class="field-group-head"><div><h3>Операционные поля листа КО</h3><p>Показаны для трассировки исходного Excel, но не входят в Golden Record</p></div><span class="scope-badge red">Контур 1С</span></div>${fieldRows(outside,s,dept,true)}</section>`:''}</div>`}
function correctionTab(s){const linked=requests.filter(r=>r.linkedSku===s.id&&r.correction);return `<section class="card panel"><div class="panel-head"><div><h2>Корректировки карточки</h2><p>Рабочие замечания, заявки из ЛКП и изменение опубликованного SKU</p></div>${s.published?`<button class="btn primary" data-action="open-change">Создать запрос изменения</button>`:`<button class="btn" data-action="open-return">Вернуть поле</button>`}</div>${s.published?`<div class="correction-banner"><div class="kpi-icon">${icon('edit')}</div><div><b>Прямое редактирование Golden Record запрещено</b><span>Система создаёт рабочую версию, запускает DQ и повторное согласование. Опубликованная версия остаётся действующей до ACK 1С.</span></div></div>`:''}${s.returns.length?`<div class="table-wrap" style="margin-top:14px"><table class="data-table"><thead><tr><th>Блок</th><th>Поле</th><th>Причина</th><th>Статус</th></tr></thead><tbody>${s.returns.map(x=>`<tr><td><b>${x.dept}</b></td><td>${x.field}</td><td>${x.reason}</td><td><span class="status amber">На доработке</span></td></tr>`).join('')}</tbody></table></div>`:'<div class="scope-note" style="margin-top:14px">Открытых точечных возвратов нет.</div>'}${linked.map(correctionDiff).join('')}</section>`}
function historyTab(s){return `<div class="grid-2"><section class="card panel"><div class="panel-head"><div><h2>История изменений</h2><p>Кто, когда, поле, старое → новое, источник</p></div></div>${timeline(s.history)}</section><section class="card panel"><div class="panel-head"><div><h2>Версии</h2><p>Рабочая версия и Golden Record</p></div></div><div class="version-list"><div class="version-card"><div class="version-num">${s.version.includes('GR')?'GR':'W'}</div><div class="version-copy"><b>${s.version} · текущая</b><span>${s.status}</span><p>${s.published?'Защищена от прямого редактирования. Следующее изменение создаст новую рабочую версию.':'Редактируется владельцами блоков, затем проходит DQ и ОМД.'}</p></div></div>${s.published?`<div class="version-card"><div class="version-num">v5</div><div class="version-copy"><b>Golden Record v5</b><span>Архивная версия</span><p>Сохранена для просмотра и аудита; откат предусмотрен в Фазе 2.</p></div></div>`:''}</div></section></div>`}
function correctionsView(){const r=reqBy('r2'),s=skuBy('sku3');return `${head('Корректировки и версии','Ни поставщик, ни сотрудник не перезаписывает действующий Golden Record напрямую.',`<button class="btn primary" data-action="open-change" data-id="sku3">${icon('plus')}Новый внутренний запрос</button>`)}<div class="kpis"><div class="card kpi"><b>1</b><span>Корректировка из ЛКП</span></div><div class="card kpi"><b>2</b><span>Точечных возврата</span></div><div class="card kpi"><b>1</b><span>Рабочая версия после публикации</span></div><div class="card kpi"><b>0</b><span>Прямых изменений GR</span></div></div><section class="card panel"><div class="panel-head"><div><h2>Входящая корректировка из ЛКП</h2><p>${r.number} · опубликованный SKU ${s.code}</p></div><button class="btn small primary" data-action="open-request" data-id="r2">Разобрать заявку</button></div>${correctionDiff(r)}</section><div class="grid-2 equal" style="margin-top:16px"><section class="card panel"><div class="panel-head"><div><h2>Точечные возвраты ОМД</h2><p>Другие блоки остаются согласованными</p></div></div><div class="mini-task-list">${skus.flatMap(s=>s.returns.map(x=>({s,x}))).map(({s,x})=>`<div class="mini-task"><i class="dept-dot"></i><div><b>${s.name}</b><span>${x.dept} · ${x.field} · ${x.reason}</span></div><button class="btn small" data-action="open-sku" data-id="${s.id}">Открыть</button></div>`).join('')}</div></section><section class="card panel"><div class="panel-head"><div><h2>Правило версий</h2><p>Опубликованная и рабочая версии существуют параллельно</p></div></div><div class="rule-list"><div class="rule ok"><div class="rule-icon">GR</div><div><b>Действующая версия</b><span>Продолжает использоваться в 1С до публикации изменения.</span></div></div><div class="rule warn"><div class="rule-icon">W</div><div><b>Рабочая версия</b><span>Проходит задания владельцев, DQ и согласование ОМД.</span></div></div><div class="rule"><div class="rule-icon">ACK</div><div><b>Замена версии</b><span>Только после подтверждения 1С новая версия становится Golden Record.</span></div></div></div></section></div>`}
function dqView(){return `${head('DQ и дубли','Автоматические правила выполняются после заполнения блоков и перед согласованием ОМД.',`<button class="btn primary" data-action="run-dq">Запустить DQ</button>`)}<div class="grid-2"><section class="card panel"><div class="panel-head"><div><h2>Quality gate</h2><p>Публикация блокируется при ошибках</p></div></div><div class="rule-list">${[['Обязательные поля по типу','178 / 184 правил'],['GTIN и контрольная цифра','Без ошибок'],['Вес брутто ≥ нетто','2 предупреждения'],['Дубли по GTIN/наименованию','1 кандидат']].map((x,i)=>`<div class="rule ${i<2?'ok':i===2?'warn':'bad'}"><div class="rule-icon">${i<2?'✓':i===2?'!':'×'}</div><div><b>${x[0]}</b><span>${x[1]}</span></div></div>`).join('')}</div></section><section class="card panel"><div class="panel-head"><div><h2>Кандидат в дубли</h2><p>Решение принимает ОМД вручную</p></div></div><div class="compare"><div class="compare-card"><h3>Заявка из ЛКП</h3><div class="compare-row"><span>GTIN</span><b>4870122203147</b></div><div class="compare-row"><span>Товар</span><b>Вода питьевая «Легенда»</b></div></div><div class="compare-card"><h3>Golden Record</h3><div class="compare-row"><span>Код 1С</span><b>Ц00043118</b></div><div class="compare-row"><span>GTIN</span><b>4870122203147</b></div></div></div><button class="btn primary" style="margin-top:12px" data-action="open-request" data-id="r2">Открыть как корректировку</button></section></div>`}
function approvalView(){const rows=skus.filter(s=>!s.published&&s.progress>60);return `${head('Согласование ОМД','ОМД проверяет карточку целиком, но возвращает адресно: блок + поле + причина.',``)}<div class="card table-wrap"><table class="data-table"><thead><tr><th>Карточка</th><th>Версия</th><th>DQ</th><th>Возвраты</th><th>Статус</th><th></th></tr></thead><tbody>${rows.map(s=>`<tr><td><b>${s.name}</b><span class="sub">${s.barcode}</span></td><td>${s.version}</td><td><span class="status ${s.dq>90?'green':'amber'}">${s.dq}/100</span></td><td>${s.returns.length}</td><td><span class="status ${statusClass(s.status)}">${s.status}</span></td><td><button class="btn small primary" data-action="open-sku" data-id="${s.id}">Проверить</button></td></tr>`).join('')}</tbody></table></div>`}
function goldenView(){const published=skus.filter(s=>s.published);return `${head('Golden Record','Эталонная версия формируется source-routing: каждое значение приходит от владельца своего блока.',``)}<div class="grid-2"><section class="card panel"><div class="panel-head"><div><h2>Готово к 1С</h2><p>Quality gate пройден, ожидается публикация</p></div></div><div class="mini-task-list"><div class="mini-task"><i class="dept-dot"></i><div><b>Сыр плавленый «Чабрец» 180 г</b><span>GR v1 · 100% · DQ 100</span></div><button class="btn small primary" data-action="publish-1c">Опубликовать</button></div></div></section><section class="card panel"><div class="panel-head"><div><h2>Опубликованные версии</h2><p>Получен обратный код 1С</p></div></div><div class="version-list">${published.map(s=>`<div class="version-card"><div class="version-num">GR</div><div class="version-copy"><b>${s.name}</b><span>${s.code} · ${s.version}</span><p>Изменение возможно только через новую рабочую версию.</p></div><button class="btn small" data-action="open-sku" data-id="${s.id}">Открыть</button></div>`).join('')}</div></section></div>`}
function journalView(){return `${head('Журнал обмена с 1С','Outbox, retry, ACK, DLQ и обратный код номенклатуры.',`<button class="btn">Повторить ошибки</button>`)}<div class="card table-wrap"><table class="data-table"><thead><tr><th>Время</th><th>Код 1С</th><th>Событие</th><th>Статус</th><th>Попытки</th></tr></thead><tbody>${journal.map(x=>`<tr><td>${x[0]}</td><td><b>${x[1]}</b></td><td>${x[2]}</td><td><span class="status ${statusClass(x[3])}">${x[3]}</span></td><td>${x[4]}</td></tr>`).join('')}</tbody></table></div>`}
function importView(){return `${head('Массовый Excel-импорт','Импорт создаёт входящий пакет, но карточки проходят те же DQ, маршрутизацию и quality gate.',``)}<div class="grid-2"><section class="card panel"><div class="panel-head"><div><h2>Загрузить шаблон</h2><p>Маппинг колонок к атрибутам MDM</p></div></div><div class="upload-zone"><div class="upload-icon">${icon('upload')}</div><h3>${state.imported?'Доп.свойства1С.xlsx':'Перетащите Excel-файл'}</h3><p>${state.imported?'4 листа: общий, КО, РЦ, Импорт':'Поддерживаются .xlsx и утверждённый шаблон'}</p><button class="btn primary" data-action="choose-file">Выбрать файл</button></div></section><section class="card panel"><div class="panel-head"><div><h2>Результат чтения</h2><p>Столбцы распределены по владельцам</p></div></div><div class="metric-list">${[['КО',KO_FIELDS.length],['КО · в MDM',koMdmFields.length],['КО · контур 1С',KO_1C_ONLY.length],['РЦ',RC_FIELDS.length],['Импорт',IMPORT_FIELDS.length]].map(x=>`<div class="metric-row"><div><b>${x[0]}</b></div><span class="metric-num">${x[1]}</span></div>`).join('')}</div><button class="btn primary" style="width:100%;margin-top:12px" data-action="process-import" ${state.imported?'':'disabled'}>Проверить и создать пакет</button></section></div>${state.importProcessed?`<section class="card panel" style="margin-top:16px"><div class="scope-note">Пакет валидирован. Корректные строки будут созданы как входящие карточки с задачами отделам, ошибочные вернутся отдельным Excel-файлом.</div><button class="btn primary" data-action="accept-import">Принять пакет</button></section>`:''}`}
function nsiView(){return `${head('НСИ и атрибуты','Мастер справочников и настроек атрибутов — MDM.',`<button class="btn primary" data-action="add-nsi">Добавить значение</button>`)}<div class="grid-2"><section class="card panel"><div class="panel-head"><div><h2>Справочники</h2></div></div><div class="directory-list">${Object.keys(directories).map(k=>`<button class="directory-item ${state.selectedDir===k?'active':''}" data-action="select-dir" data-dir="${k}"><span>${k}</span><b>${directories[k].length}</b></button>`).join('')}</div></section><section class="card panel"><div class="panel-head"><div><h2>${state.selectedDir}</h2><p>Значения НСИ</p></div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Наименование</th><th>Статус</th></tr></thead><tbody>${directories[state.selectedDir].map(v=>`<tr><td><b>${v}</b></td><td><span class="status green">Активно</span></td></tr>`).join('')}</tbody></table></div></section></div>`}
function reportsView(){return `${head('Отчёты MDM','Контроль входящих заявок, маршрутов, корректировок и публикаций.',`<button class="btn primary">${icon('download')}Выгрузить XLS</button>`)}<div class="kpis"><div class="card kpi"><b>${requests.length}</b><span>Входящие заявки</span></div><div class="card kpi"><b>${tasks.length}</b><span>Задания создано</span></div><div class="card kpi"><b>3</b><span>Возвраты / корректировки</span></div><div class="card kpi"><b>${skus.filter(s=>s.published).length}</b><span>Опубликованные GR</span></div></div><div class="grid-2 equal"><section class="card panel"><div class="panel-head"><div><h2>Нагрузка отделов</h2></div></div><div class="metric-list">${['КО','РЦ','Импорт','УЦП','ОМД'].map(d=>`<div class="metric-row"><div><b>${d}</b><span>активные задания</span></div><span class="metric-num">${tasks.filter(t=>t.assignee===d&&!t.status.includes('Заверш')).length}</span></div>`).join('')}</div></section><section class="card panel"><div class="panel-head"><div><h2>Типы входящих событий</h2></div></div><div class="metric-list"><div class="metric-row"><div><b>Новый SKU</b><span>из ЛКП</span></div><span class="metric-num">${requests.filter(r=>r.type==='Новый SKU').length}</span></div><div class="metric-row"><div><b>Корректировка SKU</b><span>без перезаписи GR</span></div><span class="metric-num">${requests.filter(r=>r.type.includes('Коррект')).length}</span></div><div class="metric-row"><div><b>Excel-пакеты</b><span>массовый импорт</span></div><span class="metric-num">1</span></div></div></section></div>`}
function modalView(){if(state.modal==='return'){const s=skuBy(state.activeSku)||skus[0];return `<div class="modal-backdrop"><div class="modal"><div class="modal-head"><div><h2>Точечный возврат поля</h2><p>Остальные блоки и значения сохраняют статус.</p></div><button class="close" data-action="close-modal">×</button></div><div class="modal-body"><div class="field-grid two"><div class="field"><label>Блок</label><select id="retDept"><option>РЦ</option><option>КО</option><option>Импорт</option><option>УЦП</option></select></div><div class="field"><label>Поле</label><select id="retField"><option>Масса со сканера</option><option>Вес брутто БЕИ, кг</option><option>ТНВЭД первичной тары</option><option>Наименование/ценник (Кыргызский язык)</option></select></div><div class="field" style="grid-column:1/-1"><label>Причина</label><textarea id="retReason">Уточнить значение и приложить подтверждение.</textarea></div></div></div><div class="modal-foot"><button class="btn" data-action="close-modal">Отмена</button><button class="btn primary" data-action="confirm-return">Вернуть поле</button></div></div></div>`}
if(state.modal==='change'){const s=skuBy(state.activeSku)||skuBy('sku3');return `<div class="modal-backdrop"><div class="modal"><div class="modal-head"><div><h2>Запрос на изменение опубликованного SKU</h2><p>${s.code} · ${s.name}</p></div><button class="close" data-action="close-modal">×</button></div><div class="modal-body"><div class="correction-banner"><div><b>Golden Record ${s.version} останется действующим</b><span>Будет создана новая рабочая версия. После DQ, ОМД и ACK 1С она заменит текущую.</span></div></div><div class="field-grid two" style="margin-top:14px"><div class="field"><label>Инициатор</label><select><option>ОМД</option><option>КО</option><option>РЦ</option><option>Импорт</option><option>УЦП</option></select></div><div class="field"><label>Блок</label><select id="changeDept"><option>КО</option><option>РЦ</option><option>Импорт</option><option>УЦП</option></select></div><div class="field" style="grid-column:1/-1"><label>Причина изменения</label><textarea id="changeReason">Изменение мастер-данных по подтверждённому запросу.</textarea></div></div></div><div class="modal-foot"><button class="btn" data-action="close-modal">Отмена</button><button class="btn primary" data-action="confirm-change">Создать рабочую версию</button></div></div></div>`}
if(state.modal==='nsi')return `<div class="modal-backdrop"><div class="modal"><div class="modal-head"><div><h2>Новое значение НСИ</h2><p>${state.selectedDir}</p></div><button class="close" data-action="close-modal">×</button></div><div class="modal-body"><div class="field"><label>Наименование</label><input id="nsiName" value="Новое значение"></div></div><div class="modal-foot"><button class="btn" data-action="close-modal">Отмена</button><button class="btn primary" data-action="save-nsi">Сохранить</button></div></div></div>`;return ''}
function render(resetScroll=true){$('#root').innerHTML=state.logged?shell(viewForScreen()):loginView();bind();if(resetScroll&&state.logged){const sc=$('.page-scroll');if(sc)sc.scrollTop=0}}
function viewForScreen(){return ({dashboard:dashboardView,requests:requestsView,request:requestView,tasks:tasksView,skus:skusView,sku:skuView,corrections:correctionsView,dq:dqView,approval:approvalView,golden:goldenView,journal:journalView,import:importView,nsi:nsiView,reports:reportsView}[state.screen]||dashboardView)()}
function bind(){$$('[data-action]').forEach(el=>el.addEventListener('click',handleAction));const role=$('[data-role]');if(role)role.addEventListener('change',e=>{state.role=e.target.value;render(false)});const rf=$('[data-request-filter]');if(rf)rf.addEventListener('change',e=>{state.requestFilter=e.target.value;render()});const tf=$('[data-task-filter]');if(tf)tf.addEventListener('change',e=>{state.taskFilter=e.target.value;render()});const gs=$('[data-global-search]');if(gs)gs.addEventListener('keydown',e=>{if(e.key==='Enter'){state.search=e.target.value;state.screen='skus';render()}});const ss=$('[data-sku-search]');if(ss)ss.addEventListener('keydown',e=>{if(e.key==='Enter'){state.search=e.target.value;render()}})}
function handleAction(e){const b=e.currentTarget,a=b.dataset.action;if(a==='login'){state.logged=true;state.screen='dashboard';render();return}if(a==='logout'){state.logged=false;render();return}if(a==='menu'){state.menu=!state.menu;render(false);return}if(a==='nav'){state.screen=b.dataset.screen;state.menu=false;render();return}if(a==='open-request'){state.activeRequest=b.dataset.id;state.screen='request';state.menu=false;render();return}if(a==='open-sku'){if(!b.dataset.id){toast('Черновик ещё не создан');return}state.activeSku=b.dataset.id;state.screen='sku';state.skuTab='overview';render();return}if(a==='sku-tab'){state.skuTab=b.dataset.tab;render(false);return}if(a==='toggle-route'){const r=reqBy(state.activeRequest);r.route[b.dataset.dept]=b.checked;render(false);return}if(a==='accept-request'){const r=reqBy(state.activeRequest);r.status='Готово к маршрутизации';r.history.push([today+' · 14:31','ОМД','Первичная проверка завершена; черновик подтверждён']);const s=skuBy(r.linkedSku);if(s)s.status='Черновик подтверждён ОМД';toast('Заявка принята. Можно запускать маршрут');return}if(a==='start-route'){const r=reqBy(state.activeRequest);r.status='Маршрутизировано';r.history.push([today+' · 14:33','ОМД','Созданы параллельные задания отделам']);const s=skuBy(r.linkedSku);if(s){s.status='Заполнение отделами';s.route=Object.keys(r.route).filter(k=>r.route[k])}Object.keys(r.route).filter(k=>r.route[k]).forEach((d,i)=>{if(!tasks.some(t=>t.request===r.id&&t.assignee===d))tasks.push({id:'t'+(tasks.length+1),sku:r.linkedSku,request:r.id,block:d+' · блок атрибутов',assignee:d,person:(employees[d]||employees.ОМД)[0],fields:d==='КО'?koMdmFields.length:d==='РЦ'?RC_FIELDS.length:d==='Импорт'?IMPORT_FIELDS.length:UCP_FIELDS.length,priority:r.priority,deadline:'01.08.2026',status:'Новая'})});state.screen='tasks';toast('Задания созданы и распределены между отделами');return}if(a==='reject-request'){const r=reqBy(state.activeRequest);r.status='Отклонено ОМД';toast('Заявка отклонена, решение записано в аудит');return}if(a==='open-return'){state.modal='return';render(false);return}if(a==='confirm-return'){const s=skuBy(state.activeSku);const dept=$('#retDept')?.value||'РЦ',field=$('#retField')?.value||'Масса со сканера',reason=$('#retReason')?.value||'Уточнить значение';s.returns.push({dept,field,reason});s.status='На доработке: '+dept;s.history.push([today+' · 14:35','ОМД',`Возврат: ${dept} · ${field}`]);state.modal=null;toast('Поле точечно возвращено в '+dept);return}if(a==='open-change'){if(b.dataset.id)state.activeSku=b.dataset.id;state.modal='change';render(false);return}if(a==='confirm-change'){const s=skuBy(state.activeSku);s.published=false;s.version='Рабочая v'+(parseInt((s.version.match(/\d+/)||['1'])[0])+1);s.status='Запрос изменения · заполнение '+($('#changeDept')?.value||'КО');s.progress=72;s.dq=80;s.history.push([today+' · 14:38',state.role,'Создана новая рабочая версия; действующий GR сохранён']);state.modal=null;toast('Рабочая версия создана. Golden Record не изменён');return}if(a==='save-draft'){const s=skuBy(state.activeSku);s.history.push([today+' · 14:40',state.role,'Сохранён черновик блока']);toast('Черновик блока сохранён');return}if(a==='complete-block'){const s=skuBy(state.activeSku);s.progress=Math.min(100,s.progress+15);s.history.push([today+' · 14:41',state.role,'Блок завершён и отправлен ОМД']);toast('Блок завершён. Полнота пересчитана');return}if(a==='approve-sku'){const s=skuBy(state.activeSku);if(s.returns.length){toast('Сначала устраните открытые точечные возвраты');return}s.status='На согласовании ОМД';s.dq=Math.max(s.dq,95);toast('Карточка отправлена в очередь ОМД');return}if(a==='run-dq'){toast('DQ выполнен: обязательность, форматы, справочники, дубли');return}if(a==='publish-1c'){toast('Событие поставлено в outbox; ожидается ACK и обратный код');return}if(a==='choose-file'){state.imported=true;state.importProcessed=false;render(false);return}if(a==='process-import'){state.importProcessed=true;render(false);toast('Столбцы распределены по владельцам');return}if(a==='accept-import'){toast('Пакет принят: создаются входящие карточки и задания');return}if(a==='select-dir'){state.selectedDir=b.dataset.dir;render(false);return}if(a==='add-nsi'){state.modal='nsi';render(false);return}if(a==='save-nsi'){directories[state.selectedDir].push($('#nsiName')?.value||'Новое значение');state.modal=null;toast('Значение НСИ сохранено');return}if(a==='close-modal'){state.modal=null;render(false);return}}
render();
</script></body></html>
