<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ЛКП + MDM · прототип потока</title>
<style>
:root{
  /* Питон (ЛКП) — синий светлый, как на скрине */
  --pi:#2b7de9; --pi-d:#1f6fd6; --pi-soft:#eaf2fe;
  /* MDM — navy */
  --navy:#1F3864; --navy-tint:#eef2f8; --teal:#1F8A8A; --teal-soft:#e3f1f1;
  --bg:#f4f6f9; --card:#fff; --line:#e3e7ee; --ink:#1f2a44; --muted:#6b7686;
  --ok:#1a7f4b; --ok-bg:#e8f6ee; --warn:#b5710b; --warn-bg:#fdf3e2;
  --err:#d23; --err-bg:#fdecec;
  --slate:#0f1a2b;
  --r:10px; --sh:0 1px 3px rgba(16,32,60,.08),0 1px 2px rgba(16,32,60,.06);
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button{font-family:inherit;cursor:pointer}
a{color:inherit}
.hidden{display:none!important}

/* верхний свитчер режимов */
.modebar{display:flex;align-items:center;gap:12px;background:var(--slate);color:#fff;padding:8px 16px}
.modebar .brand{font-weight:700;letter-spacing:.3px;opacity:.9}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.18);color:#cfd8e6;background:transparent;border-radius:999px;padding:6px 14px;font-weight:600}
.pill.active{background:#fff;color:var(--slate);border-color:#fff}
.pill.mdm.active{background:var(--navy);color:#fff}
.modebar .spacer{flex:1}
.modebar .role{display:flex;align-items:center;gap:6px;color:#cfd8e6;font-size:13px}
.modebar select{background:#1b2942;color:#fff;border:1px solid #2c3d5c;border-radius:8px;padding:6px 8px}
.modebar .reset{margin-left:8px;background:transparent;border:1px solid #2c3d5c;color:#9fb0c9;border-radius:8px;padding:6px 10px;font-size:12px}

/* каркас приложения */
.app{display:flex;min-height:calc(100vh - 42px)}
.side{width:230px;flex:0 0 230px;background:#fff;border-right:1px solid var(--line);padding:14px 10px}
.side.navy{background:#fff;border-right:1px solid var(--line)}
.side .org{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-weight:600;color:var(--ink);display:flex;justify-content:space-between;margin-bottom:12px}
.navgrp{margin:10px 4px 4px;font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
.navitem{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:8px 10px;border-radius:8px;color:#39435a;font-weight:500}
.navitem:hover{background:#f2f5f9}
.navitem.active{color:var(--pi);font-weight:700}
.navitem.active .dot{background:var(--pi)}
.side.navy .navitem.active{color:var(--navy)}
.navitem .dot{width:8px;height:8px;border-radius:50%;background:transparent}
.badge{background:#eef1f5;color:#6b7686;border-radius:999px;padding:1px 7px;font-size:11px;font-weight:700}
.badge.pi{background:var(--pi-soft);color:var(--pi-d)}
.badge.navy{background:var(--navy-tint);color:var(--navy)}

/* топ-нав Питон */
.pitop{display:flex;align-items:center;gap:26px;background:#fff;border-bottom:1px solid var(--line);padding:0 20px;height:54px}
.pitop .logo{font-weight:800;color:var(--pi);letter-spacing:.4px;font-size:18px;display:flex;align-items:center;gap:6px}
.pitop .tab{padding:0 4px;height:54px;display:flex;align-items:center;color:#5a667c;font-weight:600}
.pitop .tab.active{color:#fff;background:var(--pi);padding:0 16px}
.pitop .spacer{flex:1}
.pitop .user{display:flex;align-items:center;gap:8px;color:#39435a;font-weight:600}
.pitop .user .av{width:28px;height:28px;border-radius:50%;background:#e7eef9;display:grid;place-items:center;color:var(--pi)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.content{padding:20px 24px}
.pagehead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.pagehead h1{font-size:19px;margin:0}
.pagehead .spacer{flex:1}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card .hd{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.card .bd{padding:16px 18px}
.section-title{font-weight:700;font-size:15px;margin:0 0 12px}

/* формы */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
.field label{display:block;font-size:12px;color:#41506b;margin-bottom:5px;font-weight:600}
.field .req{color:var(--err)}
.inp,select.inp,textarea.inp{width:100%;border:1px solid #d8dee9;border-radius:8px;padding:9px 11px;font-size:14px;background:#fff;color:var(--ink)}
.inp:focus{outline:none;border-color:var(--pi);box-shadow:0 0 0 3px var(--pi-soft)}
.mdm .inp:focus{border-color:var(--navy);box-shadow:0 0 0 3px var(--navy-tint)}
textarea.inp{min-height:80px;resize:vertical}
.field.bad .inp{border-color:var(--err);background:#fff7f7}
.errmsg{color:var(--err);font-size:12px;margin-top:4px;display:none}
.field.bad .errmsg{display:block}
.hint{color:var(--muted);font-size:12px;margin-top:4px}
.help{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:#e7eef9;color:var(--pi-d);font-size:10px;font-weight:800;cursor:help;margin-left:5px}
.chk{display:flex;align-items:center;gap:8px;font-weight:600;color:#39435a}

/* кнопки */
.btn{border:1px solid #d8dee9;background:#fff;border-radius:8px;padding:9px 14px;font-weight:600;color:#39435a;display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:#f5f8fc}
.btn.primary{background:var(--pi);border-color:var(--pi);color:#fff}
.btn.primary:hover{background:var(--pi-d)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.navy:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--pi)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.warn{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.link{border:none;background:none;color:var(--pi);padding:4px}

/* таблицы */
table{border-collapse:collapse;width:100%}
.tbl th,.tbl td{border:1px solid var(--line);padding:9px 10px;text-align:left;font-size:13px;vertical-align:middle}
.tbl th{background:#f7f9fc;color:#41506b;font-weight:700}
.tbl thead .grp th{background:#eef2f8;text-align:center}
.tbl td .inp{padding:6px 8px}
.rowdel{color:#9aa3b2;cursor:pointer}
.scroll-x{overflow-x:auto}

/* статусы / чипы */
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700}
.chip.grey{background:#eef1f5;color:#6b7686}
.chip.blue{background:var(--pi-soft);color:var(--pi-d)}
.chip.navy{background:var(--navy-tint);color:var(--navy)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.err{background:#fdecec;color:var(--err)}
.chip.teal{background:var(--teal-soft);color:var(--teal)}

/* степпер */
.stepper{display:flex;align-items:center;gap:0;margin:6px 0 18px}
.step{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;font-weight:600}
.step .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#e6eaf1;color:#8892a4;font-size:12px}
.step.done .n{background:var(--ok);color:#fff}
.step.cur .n{background:var(--navy);color:#fff}
.step.cur{color:var(--navy)}
.step .bar{width:34px;height:2px;background:#e0e5ee;margin:0 8px}

/* задачи-карточки */
.tasklist{display:grid;gap:10px}
.taskrow{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff}
.taskrow .role{width:120px;font-weight:700}
.taskrow .spacer{flex:1}
.rolechip{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:4px 9px;font-size:12px;font-weight:700}
.rolechip.KO{background:#e7f0ff;color:#1f6fd6}
.rolechip.RC{background:#e6f6f1;color:#0e7a52}
.rolechip.OMD{background:var(--navy-tint);color:var(--navy)}

/* обзор ОМД по отделам */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab2{padding:9px 14px;border:1px solid transparent;border-bottom:none;border-radius:8px 8px 0 0;font-weight:700;color:#5a667c;cursor:pointer}
.tab2.active{background:#fff;border-color:var(--line);color:var(--navy)}
.attrrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:#fff}
.attrrow .k{font-weight:600;color:#41506b}
.attrrow .v{color:var(--ink)}
.attrrow.acc{background:var(--ok-bg);border-color:#bfe3cd}
.attrrow.rew{background:#fdf3e2;border-color:#f0d9a8}
.miniactions{display:flex;gap:6px}
.chipbtn{border:1px solid #d8dee9;background:#fff;border-radius:7px;padding:4px 9px;font-size:12px;font-weight:700;color:#5a667c}
.chipbtn.on-acc{background:var(--ok);border-color:var(--ok);color:#fff}
.chipbtn.on-rew{background:var(--warn);border-color:var(--warn);color:#fff}
.buffer{display:flex;gap:10px;margin:6px 0 14px;flex-wrap:wrap}
.bufcard{border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;background:#fff}
.bufcard b{font-size:16px}

/* toast */
.toast{position:fixed;right:18px;bottom:18px;background:var(--slate);color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-weight:600;z-index:50;max-width:340px}
.toast .s{color:#7ee0a8}
.empty{padding:40px;text-align:center;color:var(--muted)}
.k1c{font-family:ui-monospace,Menlo,monospace}
.small{font-size:12px;color:var(--muted)}

/* ===== MDM «как раньше»: крупный радиус, мягкая тень, красный акцент ===== */
:root{--red:#e30613;--red-dark:#b9000a;--red-soft:#fff0f1;--green:#14834e;--violet:#6f46c7;--violet-bg:#f2edff}
.pill.mdm.active{background:var(--red);color:#fff;border-color:var(--red)}
.mdmv .card{border-radius:18px;box-shadow:0 4px 14px rgba(17,18,20,.04)}
.mdmv .card .hd{font-weight:800}
.mdmv h1{font-weight:800}
.mdmv .section-title{font-weight:800}
.mdmv .btn{min-height:42px;border-radius:12px;font-weight:800}
.mdmv .btn.navy{background:var(--red);border-color:var(--red);color:#fff}
.mdmv .btn.navy:hover{background:var(--red-dark)}
.mdmv .inp:focus{border-color:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.mdmv .tbl th{background:#f6f7f8;color:#5d6570;font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:800}
.mdmv .navitem.active{color:var(--red)}
.mdmv .navitem.active .dot{background:var(--red)}
.mdmv .badge.navy{background:var(--red-soft);color:var(--red-dark)}
.mdmv .chip.navy{background:var(--red-soft);color:var(--red-dark)}
.mdmv .step.cur .n{background:var(--red)}
.mdmv .step.cur{color:var(--red)}
.mdmv .rolechip.OMD{background:var(--red-soft);color:var(--red-dark)}
.mdmv .rolechip.IMP{background:var(--violet-bg);color:var(--violet)}
.mdmv .tab2.active{color:var(--red)}
.correction-banner{border:1px solid #e7be74;background:#fff8e9;border-radius:15px;padding:14px 15px;display:flex;gap:12px;margin-bottom:14px}
.correction-banner b{display:block;font-size:13px;color:#7d5a23}
.correction-banner span{display:block;color:#7d5a23;font-size:12px;margin-top:4px}
.kpi{border:1px solid var(--line);border-radius:14px;padding:15px 16px;background:#fff;min-width:150px}
.kpi b{display:block;font-size:26px;line-height:1;margin-top:6px}
.kpi span{display:block;color:var(--muted);font-size:12px;margin-top:6px}
.diff-old{color:#9c3138;text-decoration:line-through}
.diff-new{color:var(--green);font-weight:800}
.dupcard{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:#fff}
.chip.violet{background:var(--violet-bg);color:var(--violet)}
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ============================== СОСТОЯНИЕ ============================== */
const PARTNERS=["Жумабаев Барсбек Нурланбекович ИП","ОсОО «Тянь-Шань Фудс»","ИП Асанова А."];
const CATS=["Без категории","Бакалея / Крупы","Напитки","Молочная продукция","Бытовая химия"];

/* реестр существующих записей 1С — для обратной проверки на дубли */
const REGISTRY_1C=[
  {code:'Ц204513', name:'Молоко 3,2% 1 л', barcode:'4006381333931'},
  {code:'Ц198220', name:'Вода питьевая 0,5 л', barcode:'4870204010107'},
];
/* 13 доп. свойств менеджера по импорту (из Excel «доп. свойства») */
const IMPORT_FIELDS=[
  {k:'im_group',l:'Группа товаров'},
  {k:'im_line',l:'Линейка номенклатуры'},
  {k:'im_buytype',l:'Тип закупа',type:'sel',opts:['Импорт','Локальный']},
  {k:'im_return',l:'Срок возвратов, дн.',type:'num'},
  {k:'im_avgw',l:'Средний вес единицы, кг',type:'num'},
  {k:'im_cap',l:'Ёмкость'},
  {k:'im_round',l:'Граница округления (ГУ1–ГУ4)',type:'num'},
  {k:'im_glovo',l:'Выгружать в glovo/Globus',type:'chk'},
  {k:'im_noreal',l:'Не выгружать из заказа в реализацию (ИМ)',type:'chk'},
  {k:'im_new',l:'Новинка для МП+ИМ',type:'chk'},
  {k:'im_quant',l:'Квант поставки для ИМ',type:'num'},
  {k:'im_scanmass',l:'Масса со сканера, кг',type:'num'},
  {k:'im_nomen',l:'Номенклатура'},
];

const S={
  mode:'lkp',
  lkp:{screen:'assortment', doc:null, role:'Поставщик'},
  mdm:{role:'ОМД', screen:'requests', openId:null, tab:'КО'},
  seq:1,
  requests:[],
  toast:null
};

/* поля по ролям (представительный набор из Excel «Данные_по_категориям») */
const FIELDS={
  'КО':[
    {k:'nameRuFull',l:'Наименование полное (RU)',req:1,grp:'Основные'},
    {k:'nameRuPrice',l:'Наименование ценник (RU)',req:1,grp:'Основные'},
    {k:'nameKg',l:'Наименование/ценник (KG)',req:1,grp:'Основные'},
    {k:'barcode',l:'Штрих-код (EAN-8/13)',req:1,grp:'Основные',v:'ean',hint:'8 или 13 цифр, контрольная цифра проверяется'},
    {k:'tnved',l:'Код ТНВЭД',req:1,grp:'Основные',v:'tnved',hint:'ровно 10 цифр'},
    {k:'country',l:'Страна происхождения',req:1,grp:'Основные'},
    {k:'brand',l:'Товарная марка',grp:'Основные'},
    {k:'typeNom',l:'Тип номенклатуры',type:'sel',opts:['Товар','Весовой','Комплект'],req:1,grp:'Основные'},
    {k:'vat',l:'НДС',type:'sel',opts:['0%','12%'],req:1,grp:'Коммерческие'},
    {k:'priceZak',l:'Цена закупки без НДС',type:'num',req:1,grp:'Коммерческие'},
    {k:'markN',l:'Наценка Север, %',type:'num',grp:'Коммерческие'},
    {k:'markS',l:'Наценка Юг, %',type:'num',grp:'Коммерческие'},
  ],
  'РЦ':[
    {k:'beiW',l:'Ширина БЕИ, м',type:'num',req:1,grp:'БЕИ'},
    {k:'beiH',l:'Высота БЕИ, м',type:'num',req:1,grp:'БЕИ'},
    {k:'beiD',l:'Глубина БЕИ, м',type:'num',req:1,grp:'БЕИ'},
    {k:'beiNet',l:'Вес нетто БЕИ, кг',type:'num',req:1,grp:'БЕИ'},
    {k:'beiGross',l:'Вес брутто БЕИ, кг',type:'num',req:1,grp:'БЕИ'},
    {k:'beiUnit',l:'Базовая ЕИ',type:'sel',opts:['шт','кг','л'],req:1,grp:'БЕИ'},
    {k:'gu1bar',l:'Ш/К ГУ1',grp:'Упаковка ГУ1',v:'ean_opt',hint:'если есть — валидируется как EAN'},
    {k:'gu1qty',l:'Кол-во в ГУ1',type:'num',req:1,grp:'Упаковка ГУ1'},
    {k:'gu1round',l:'Граница округления ГУ1',type:'num',grp:'Упаковка ГУ1'},
    {k:'shelf',l:'Срок хранения, сут.',type:'num',req:1,grp:'Хранение'},
    {k:'tempFrom',l:'Темп. от, °C',type:'num',grp:'Хранение'},
    {k:'tempTo',l:'Темп. до, °C',type:'num',grp:'Хранение',v:'tempto'},
    {k:'goodsType',l:'Тип товара',type:'sel',opts:['штучный','весовой'],req:1,grp:'Хранение'},
    {k:'halal',l:'Халал',type:'chk',grp:'Хранение'},
  ],
  'ОМД':[
    {k:'gu3W',l:'Ширина ГУ3, м',type:'num',grp:'Упаковка ГУ3'},
    {k:'gu3H',l:'Высота ГУ3, м',type:'num',grp:'Упаковка ГУ3'},
    {k:'gu3D',l:'Глубина ГУ3, м',type:'num',grp:'Упаковка ГУ3'},
    {k:'gu3qty',l:'Кол-во БЕИ в ГУ3',type:'num',grp:'Упаковка ГУ3'},
  ]
};
const ROLES=['КО','РЦ','ОМД'];
const ROLECLS={'КО':'KO','РЦ':'RC','ОМД':'OMD'};

/* ============================== ВАЛИДАЦИЯ ============================== */
function eanOk(v){
  v=String(v||'').trim(); if(!/^\d+$/.test(v))return false;
  if(v.length!==8 && v.length!==13)return false;
  const d=v.split('').map(Number), c=d.pop();
  let s=0; d.reverse().forEach((n,i)=>{ s+= n*((i%2===0)?3:1); });
  return ((10-(s%10))%10)===c;
}
function fieldError(f,val,all){
  const v=(val==null?'':String(val)).trim();
  if(f.req && f.type!=='chk' && v==='') return 'Обязательное поле';
  if(v==='') return '';
  if(f.v==='ean' && !eanOk(v)) return 'Неверный EAN (длина/контрольная цифра)';
  if(f.v==='ean_opt' && v!=='' && !eanOk(v)) return 'Неверный EAN';
  if(f.v==='tnved' && !/^\d{10}$/.test(v)) return 'ТНВЭД — ровно 10 цифр';
  if(f.type==='num'){ const n=Number(v.replace(',','.')); if(isNaN(n)) return 'Число'; if(n<=0 && f.req) return 'Должно быть > 0'; }
  if(f.v==='tempto' && all){ const a=parseFloat(all.tempFrom), b=parseFloat(v); if(!isNaN(a)&&!isNaN(b)&&b<a) return '«до» меньше «от»'; }
  return '';
}
function taskErrors(role,fields){
  const errs={};
  FIELDS[role].forEach(f=>{ const e=fieldError(f,fields[f.k],fields); if(e)errs[f.k]=e; });
  return errs;
}

/* ============================== ХЕЛПЕРЫ ============================== */
const $=s=>document.querySelector(s);
function toast(msg){ S.toast=msg; render(); clearTimeout(window.__t); window.__t=setTimeout(()=>{S.toast=null;render();},3200); }
function reqById(id){ return S.requests.find(r=>r.id===id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ============================== ЛКП: РЕНДЕР ============================== */
function lkpSidebar(){
  const it=(scr,label,badge,grp)=>{
    const active=S.lkp.screen===scr?'active':'';
    const b=badge!=null?`<span class="badge">${badge}</span>`:'';
    return `<div class="navitem ${active}" onclick="lkpNav('${scr}')"><span style="display:flex;align-items:center;gap:8px"><span class="dot"></span>${label}</span>${b}</div>`;
  };
  return `<aside class="side">
    <div class="org">Умай Групп <span>▾</span></div>
    <div class="navgrp">Документы</div>
    ${it('assortment','Ассортимент', S.requests.length||0)}
    ${it('repricing','Переоценка', 38)}

    <div class="navgrp">Отчёты</div>

function statusChip(r){
  const map={
    'Отправлена':'blue','Подтверждена':'navy','Заполнение':'navy',
    'На проверке ОМД':'teal','На доработке':'warn','Одобрено':'ok','Опубликовано в 1С':'ok',
    'Опубликовано в 1С (замена)':'ok','Отклонено (дубль)':'err'
  };
  return `<span class="chip ${map[r.status]||'grey'}">${r.status}</span>`;
}
function stepper(r){
  const steps=['Отправлена','Заполнение','Проверка ОМД','Одобрено','1С'];
  let idx=0;
  if(r.status==='Отправлена')idx=0;
  else if(r.status==='Подтверждена'||r.status==='Заполнение'||r.status==='На доработке')idx=1;
  else if(r.status==='На проверке ОМД')idx=2;
  else if(r.status==='Одобрено'||r.status==='Отклонено (дубль)')idx=3;
  else if(r.status==='Опубликовано в 1С'||r.status==='Опубликовано в 1С (замена)')idx=4;
  return `<div class="stepper">${steps.map((s,i)=>{
    const cls=i<idx?'done':(i===idx?'cur':'');
    return `<div class="step ${cls}"><span class="n">${i<idx?'✓':i+1}</span>${s}</div>${i<steps.length-1?'<span class="bar"></span>':''}`;
  }).join('')}</div>`;
}

function mdmTaskFill(){
  const r=reqById(S.mdm.openId), role=S.mdm.role, t=r.tasks[role];
  const only = t.state==='Доработка' ? t.rework : null; // только флагнутые
  const errs = t.showErr ? taskErrors(role,t.fields) : {};
  // группировка
  const groups={};
  FIELDS[role].forEach(f=>{ if(only && !only.includes(f.k)) return; (groups[f.grp]=groups[f.grp]||[]).push(f); });
  const body=Object.keys(groups).map(g=>`
    <div class="section-title" style="margin-top:6px">${g}</div>
    <div class="grid g3">
      ${groups[g].map(f=>fieldHtml(f,t.fields[f.k],errs[f.k],r,role)).join('')}
    </div>`).join('');
  const rew = only ? `<div class="chip warn" style="margin-bottom:10px">Режим доработки: показаны только возвращённые атрибуты (${only.length}). Остальные приняты и заблокированы.</div>` : '';
  return `<div class="content mdm">
    <div class="pagehead"><button class="btn sm" onclick="mdmNav('mytasks')">← К задачам</button></div>

function fieldHtml(f,val,err,r,role){
  const bad=err?'bad':'';
  const help=f.hint?`<span class="help" title="${esc(f.hint)}">?</span>`:'';
  const req=f.req?' <span class="req">*</span>':'';
  let ctrl='';
  if(f.type==='sel'){
    ctrl=`<select class="inp" onchange="setField('${r.id}','${role}','${f.k}',this.value)"><option value=""></option>${f.opts.map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  }else if(f.type==='chk'){
    return `<div class="field"><label>${f.l}${help}</label><label class="chk"><input type="checkbox" ${val?'checked':''} onchange="setField('${r.id}','${role}','${f.k}',this.checked)"> да</label></div>`;
  }else{
    ctrl=`<input class="inp" value="${esc(val)}" oninput="setField('${r.id}','${role}','${f.k}',this.value)">`;
  }
  return `<div class="field ${bad}"><label>${f.l}${req}${help}</label>${ctrl}<div class="errmsg">${esc(err||'')}</div></div>`;
}

function mdmReviewCard(){
  const r=reqById(S.mdm.openId), tab=S.mdm.tab;
  const rev=r.review;
  // буфер
  let acc=0,rew=0,pen=0;
  Object.keys(rev).forEach(k=>{ if(rev[k].state==='accepted')acc++; else if(rev[k].state==='rework')rew++; else pen++; });
  const allTabs=ROLES.concat(r.importProps?['Импорт']:[]);
  const cnt=t=> t==='Импорт'?IMPORT_FIELDS.length:FIELDS[t].length;
  const tabs=allTabs.map(role=>`<div class="tab2 ${tab===role?'active':''}" onclick="setReviewTab('${role}')">${role} <span class="badge">${cnt(role)}</span></div>`).join('');
  const tf=tabFields(r,tab);
  const attrRows=tf.fields.map(f=>{
    const val=tf.values[f.k]; const st=rev[f.k]?rev[f.k].state:'pending';
    const disp = f.type==='chk' ? (val?'да':'нет') : (val==null||val===''?'—':val);
    const cls=st==='accepted'?'acc':(st==='rework'?'rew':'');
    return `<div class="attrrow ${cls}">
      <div><div class="k">${f.l}</div><div class="v">${esc(disp)}</div>${rev[f.k]&&rev[f.k].comment?`<div class="small" style="color:#b5710b">↩ ${esc(rev[f.k].comment)}</div>`:''}</div>
      <div class="miniactions">
        <button class="chipbtn ${st==='accepted'?'on-acc':''}" onclick="markAttr('${f.k}','accepted')">Принять</button>
        ${tf.importTab?'':`<button class="chipbtn ${st==='rework'?'on-rew':''}" onclick="markAttr('${f.k}','rework')">На доработку</button>`}
      </div>
    </div>`;
  }).join('');
  const impNote = tab==='Импорт' ? `<div class="correction-banner"><div>📦</div><div><b>Данные от менеджера по импорту</b><span>Основные данные и 13 доп. свойств получены из ЛКП. Проверьте и примите; при ошибке — уточнение запрашивается у менеджера по импорту вне автопотока.</span></div></div>` : '';
  const canApprove = (acc>0) && rew===0 && pen===0 && r.status==='На проверке ОМД';
  return `<div class="content"><div class="pagehead"><button class="btn sm" onclick="mdmNav('review')">← К списку</button></div>
    ${reqHeaderCard(r)}
    <div class="buffer">
      <div class="bufcard">Всего атрибутов: <b>${Object.keys(rev).length}</b></div>
      <div class="bufcard" style="color:var(--ok)">Принято: <b>${acc}</b></div>
      <div class="bufcard" style="color:var(--warn)">На доработку: <b>${rew}</b></div>
      <div class="bufcard" style="color:#6b7686">Не отмечено: <b>${pen}</b></div>
    </div>
    <div class="card"><div class="bd">
      <div class="tabs">${tabs}</div>
      ${impNote}
      ${attrRows}
      <div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn warn" onclick="returnRework('${r.id}')">↩ Вернуть на доработку (${rew})</button>
        <button class="btn ok ${canApprove?'':'disabled'}" ${canApprove?'':'style="opacity:.5;pointer-events:none"'} onclick="finalApprove('${r.id}')">✓ Финальный апрув → 1С</button>
        <span class="small" style="align-self:center">Апрув доступен, когда все атрибуты приняты и нет возвратов.</span>
      </div>
    </div></div>
  </div>`;
}
function mdmPublish(){
  const list=S.requests.filter(r=>['Одобрено','Опубликовано в 1С','Опубликовано в 1С (замена)','Отклонено (дубль)'].includes(r.status));
  const rows=list.map(r=>{
    let right;
    if(r.status==='Одобрено') right=`<button class="btn navy sm" onclick="openDedup('${r.id}')">Проверить и загрузить в 1С</button>`;
    else if(r.status==='Отклонено (дубль)') right=`<span class="chip err">не загружено (дубль)</span>`;
    else right=`<span class="chip teal">обратный код получен</span>`;
    return `<div class="taskrow">
      <div><b>${r.id}</b> · ${esc(r.card.nameRu)}<div class="small">${r.code1c?('Код 1С: <span class=k1c>'+r.code1c+'</span>'):'ожидает загрузки'}</div></div>
      <div class="spacer"></div>${statusChip(r)} ${right}
    </div>`;}).join('');
  return `<div class="content"><div class="pagehead"><h1>Публикация в 1С</h1></div>
    <div class="tasklist">${rows||`<div class="empty">Нет одобренных карточек.</div>`}</div></div>`;
}

/* ============================== ДЕЙСТВИЯ ЛКП ============================== */
function lkpNav(s){ S.lkp.screen=s; render(); }
function newDoc(){
  const byImport = S.lkp.role==='Менеджер по импорту';
  S.lkp.doc={date:nowStr(),partner:PARTNERS[0],category:CATS[0],note:'',showErr:false,
    byImport, imp:{}, items:[emptyItem()]};
  S.lkp.screen='newdoc'; render();
}
function setImp(k,v){ S.lkp.doc.imp[k]=v; }
function emptyItem(){ return {gr:'',nameKg:'',nameRu:'',art:'',brand:'',country:'',unit:'шт',cap:''}; }
function addItem(){ S.lkp.doc.items.push(emptyItem()); render(); }
function delItem(i){ S.lkp.doc.items.splice(i,1); if(!S.lkp.doc.items.length)S.lkp.doc.items.push(emptyItem()); render(); }
function setItem(i,k,v){ S.lkp.doc.items[i][k]=v; } // без ре-рендера (сохранение фокуса)
function setDoc(k,v){ S.lkp.doc[k]=v; }
function saveDoc(){
  const d=S.lkp.doc;
  const bad=d.items.some(it=>!it.nameKg.trim()||!it.nameRu.trim());
  if(bad){ d.showErr=true; render(); toast('Заполните обязательные наименования (КЫРГ и РУС)'); return; }
  const id='REQ-'+String(S.seq++).padStart(4,'0');
  const first=d.items[0];
  const req={
    id, date:d.date, partner:d.partner, category:d.category, note:d.note,
    items:d.items.map(x=>({...x})),
    card:{nameRu:first.nameRu,nameKg:first.nameKg,art:first.art,brand:first.brand,country:first.country,unit:first.unit,cap:first.cap},
    status:'Отправлена', code1c:null,
    byImport: !!d.byImport,
    importProps: d.byImport ? {...d.imp} : null,
    tasks:{ 'КО':newTask('КО',first), 'РЦ':newTask('РЦ',first), 'ОМД':newTask('ОМД',first) },
    review:{}
  };
  S.requests.push(req);
  S.lkp.screen='assortment';
  render(); toast('Заявка '+id+' сохранена и отправлена в MDM ✓');
}
function newTask(role,first){
  // префилл из данных поставщика, где совпадает
  const f={};
  if(role==='КО'){ f.nameRuFull=first.nameRu; f.nameRuPrice=first.nameRu; f.nameKg=first.nameKg; f.brand=first.brand; f.country=first.country; }
  return {state:'—',fields:f,rework:[],showErr:false};
}

/* ============================== ДЕЙСТВИЯ MDM ============================== */
function mdmNav(s){ S.mdm.screen=s; render(); }
function openReq(id){ S.mdm.openId=id; render(); const r=reqById(id);
  // если ОМД и заявка новая — показываем экран подтверждения
  S.__reqView=true; renderReqView(r);
}
function renderReqView(r){ // отдельный проход для экрана заявки
  S.mdm.screen='reqview'; render();
}
function confirmReq(id){
  const r=reqById(id);
  ROLES.forEach(role=>{ r.tasks[role].state='Назначена'; });
  r.status='Подтверждена';
  // инициализируем реестр проверки (буфер) — все атрибуты pending
  r.review={};
  ROLES.forEach(role=>FIELDS[role].forEach(f=>{ r.review[f.k]={state:'pending',comment:'',role}; }));
  if(r.importProps){ IMPORT_FIELDS.forEach(f=>{ r.review[f.k]={state:'pending',comment:'',role:'Импорт'}; }); }
  render(); toast('Заявка подтверждена. Задачи розданы: КО, РЦ, ОМД'+(r.importProps?' · Импорт (данные уже получены)':'')+'.');
}
function openTask(id){ S.mdm.openId=id; S.mdm.screen='task'; render(); }
function setField(id,role,k,v){ reqById(id).tasks[role].fields[k]=v; } // без ре-рендера
function saveTaskDraft(id){ const r=reqById(id); if(r.tasks[S.mdm.role].state==='Назначена')r.tasks[S.mdm.role].state='Назначена'; toast('Черновик сохранён'); }
function submitTask(id){
  const r=reqById(id), role=S.mdm.role, t=r.tasks[role];
  const only = t.state==='Доработка' ? t.rework : FIELDS[role].map(f=>f.k);
  // валидация (в режиме доработки — только возвращённые поля)
  const errs={};
  FIELDS[role].forEach(f=>{ if(!only.includes(f.k))return; const e=fieldError(f,t.fields[f.k],t.fields); if(e)errs[f.k]=e; });
  if(Object.keys(errs).length){ t.showErr=true; render(); toast('Есть ошибки валидации — исправьте подсвеченные поля'); return; }
  t.showErr=false;
  // если была доработка — эти атрибуты снова pending для ОМД
  if(t.state==='Доработка'){ t.rework.forEach(k=>{ r.review[k]={state:'pending',comment:'',role}; }); t.rework=[]; }
  t.state='Сдана';
  // если все задачи сданы → на проверку ОМД
  const allDone=ROLES.every(rr=>r.tasks[rr].state==='Сдана');
  if(allDone) r.status='На проверке ОМД';
  else if(r.status!=='На доработке') r.status='Заполнение';
  render();
  toast(allDone?'Все задачи сданы — карточка на проверке ОМД':'Задача сдана. Ожидаем остальные роли.');
}
function openReview(id){ S.mdm.openId=id; S.mdm.screen='reviewOne'; S.mdm.tab='КО'; render(); }
function setReviewTab(role){ S.mdm.tab=role; render(); }
function markAttr(k,state){
  const r=reqById(S.mdm.openId);
  const cur=r.review[k]||{state:'pending',comment:''};
  if(state==='rework'){
    const c=prompt('Причина возврата на доработку (для исполнителя):', cur.comment||'');
    if(c===null) return;
    r.review[k]={state:'rework',comment:c,role:cur.role};
  }else{
    r.review[k]={state:'accepted',comment:'',role:cur.role};
  }
  render();
}
function returnRework(id){
  const r=reqById(id);
  const byRole={};
  Object.keys(r.review).forEach(k=>{ const rv=r.review[k]; if(rv.state==='rework'){ (byRole[rv.role]=byRole[rv.role]||[]).push(k); }});
  const roles=Object.keys(byRole);
  if(!roles.length){ toast('Нет атрибутов, помеченных «на доработку»'); return; }
  roles.forEach(role=>{ const t=r.tasks[role]; if(!t)return; t.state='Доработка'; t.rework=byRole[role]; });
  r.status='На доработке';
  render();
  toast('Возвращено на доработку: '+roles.map(x=>x+' ('+byRole[x].length+')').join(', '));
}
function finalApprove(id){
  const r=reqById(id);
  r.status='Одобрено';
  render(); toast('Карточка одобрена ОМД. Готова к публикации в 1С.');
}
function publish1C(id){
  const r=reqById(id);
  r.code1c='Ц'+String(Math.floor(100000+Math.random()*899999));
  r.status='Опубликовано в 1С';
  S.mdm.screen='publish';
  render(); toast('Опубликовано в 1С. Обратный код: '+r.code1c);
}

/* ===== обратная проверка на дубли из 1С ===== */
function findDup(r){
  const bc=(r.tasks['КО'].fields.barcode||'').trim();
  const nm=(r.card.nameRu||'').toLowerCase().trim();
  for(const e of REGISTRY_1C){ if(bc && e.barcode===bc) return {e,reason:'совпадение штрих-кода'}; }
  for(const e of REGISTRY_1C){
    const a=new Set(nm.split(/\s+/).filter(Boolean));
    const b=new Set(e.name.toLowerCase().split(/\s+/).filter(Boolean));
    const inter=[...a].filter(x=>b.has(x)).length;
    const sim=inter/Math.max(1,Math.min(a.size,b.size));
    if(sim>=0.6) return {e,reason:'схожесть наименования'};
  }
  return null;
}
function openDedup(id){ S.mdm.openId=id; S.mdm.screen='dedup'; render(); }
function mdmDedup(r){
  const dup=findDup(r);
  const bc=r.tasks['КО'].fields.barcode||'—';
  if(!dup){
    return `<div class="content"><div class="pagehead"><button class="btn sm" onclick="mdmNav('publish')">← Назад</button></div>
      ${reqHeaderCard(r)}
      <div class="card"><div class="bd">
        <div class="section-title">Обратная проверка в 1С</div>
        <div class="chip ok" style="margin-bottom:12px">✓ Дубликатов не найдено (по штрих-коду и наименованию)</div>
        <p class="small">Проверено: штрих-код <span class="k1c">${esc(bc)}</span>, наименование «${esc(r.card.nameRu)}», компоненты карточки.</p>
        <button class="btn navy" onclick="publish1C('${r.id}')">Загрузить в 1С</button>
      </div></div></div>`;
  }
  return `<div class="content"><div class="pagehead"><button class="btn sm" onclick="mdmNav('publish')">← Назад</button></div>
    ${reqHeaderCard(r)}
    <div class="card"><div class="bd">
      <div class="section-title">Обратная проверка в 1С</div>
      <div class="correction-banner"><div>⚠️</div><div><b>Найден возможный дубль в 1С</b><span>Причина: ${esc(dup.reason)}. Выберите действие.</span></div></div>
      <table class="tbl" style="margin-bottom:14px">
        <thead><tr><th>Поле</th><th>Существует в 1С</th><th>Новая карточка</th></tr></thead>
        <tbody>
          <tr><td>Код 1С</td><td class="k1c">${dup.e.code}</td><td class="small">будет присвоен</td></tr>
          <tr><td>Наименование</td><td>${esc(dup.e.name)}</td><td class="diff-new">${esc(r.card.nameRu)}</td></tr>
          <tr><td>Штрих-код</td><td class="k1c">${esc(dup.e.barcode)}</td><td class="k1c">${esc(bc)}</td></tr>
        </tbody>
      </table>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn warn" onclick="resolveDedup('${r.id}','replace')">Заменить старую запись</button>
        <button class="btn" onclick="resolveDedup('${r.id}','skip')">Не загружать новую</button>
      </div>
    </div></div></div>`;
}
function resolveDedup(id,action){
  const r=reqById(id), dup=findDup(r);
  if(action==='replace'){ r.code1c=dup?dup.e.code:('Ц'+String(Math.floor(100000+Math.random()*899999))); r.status='Опубликовано в 1С (замена)'; toast('Старая запись заменена. Код 1С: '+r.code1c); }
  else { r.status='Отклонено (дубль)'; toast('Новая запись не загружена (дубль).'); }
  S.mdm.screen='publish'; render();
}

/* переход из ЛКП «смотреть в MDM» */
function mdmOpenFromLkp(id){ S.mode='mdm'; S.mdm.role='ОМД'; S.mdm.openId=id; S.mdm.screen='reqview'; render(); }

/* ============================== ОБЩЕЕ ============================== */
function nowStr(){ const d=new Date(); const p=n=>String(n).padStart(2,'0');
  return `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()}, ${p(d.getHours())}:${p(d.getMinutes())}`; }
function switchMode(m){ S.mode=m; render(); }
function setLkpRole(v){ S.lkp.role=v; if(S.lkp.doc){ S.lkp.doc.byImport=(v==='Менеджер по импорту'); } S.lkp.screen='assortment'; render(); }
function setRole(v){ S.mdm.role=v; S.mdm.screen='mytasks'; if(v==='ОМД')S.mdm.screen='requests'; render(); }
function resetDemo(){ if(confirm('Сбросить демо-данные?')){ S.requests=[]; S.seq=1; S.lkp={screen:'assortment',doc:null}; S.mdm={role:'ОМД',screen:'requests',openId:null,tab:'КО'}; render(); } }

function modebar(){
  let roleSel='';
  if(S.mode==='mdm'){
    roleSel = `<div class="role">Роль:
      <select onchange="setRole(this.value)">
        ${['ОМД','КО','РЦ'].map(x=>`<option ${S.mdm.role===x?'selected':''}>${x}</option>`).join('')}
      </select></div>`;
  }else{
    roleSel = `<div class="role">Роль:
      <select onchange="setLkpRole(this.value)">
        ${['Поставщик','Менеджер по импорту'].map(x=>`<option ${S.lkp.role===x?'selected':''}>${x}</option>`).join('')}
      </select></div>`;
  }
  return `<div class="modebar">
    <span class="brand">UMAI · поток данных</span>
    <button class="pill ${S.mode==='lkp'?'active':''}" onclick="switchMode('lkp')">ЛКП · Питон</button>
    <button class="pill mdm ${S.mode==='mdm'?'active':''}" onclick="switchMode('mdm')">MDM · внутренний</button>
    <div class="spacer"></div>
    ${roleSel}
    <button class="reset" onclick="resetDemo()">Сбросить демо</button>
  </div>`;
}
function render(){
  let inner='';
  if(S.mode==='lkp'){
    inner=`<div class="app">${lkpSidebar()}<div class="main">${lkpTop()}${lkpContent()}</div></div>`;
  }else{
    let c;
    if(S.mdm.screen==='reqview'){ c=mdmOpenReqView(reqById(S.mdm.openId)); }
    else c=mdmContent();
    inner=`<div class="app mdmv">${mdmSidebar()}<div class="main">${c}</div></div>`;
  }
  const toastHtml=S.toast?`<div class="toast"><span class="s">●</span> ${esc(S.toast)}</div>`:'';
  document.getElementById('root').innerHTML=modebar()+inner+toastHtml;
}
render();
</script>
